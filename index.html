            --blue: #5b9cf6;
            --blue-soft: rgba(91, 156, 246, 0.14);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --card-border-width: 1px;
            --title-weight: 700;
            --title-tracking: 0.6px;
            --shadow-card: 0 2px 10px rgba(0, 0, 0, 0.3);
            --shadow-pop: 0 16px 40px rgba(0, 0, 0, 0.6);
            --shadow-bar: 0 -4px 20px rgba(0, 0, 0, 0.4);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        html {
            -webkit-text-size-adjust: 100%;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background:
                radial-gradient(circle at 15% 0%, var(--gold-soft), transparent 40%),
                var(--bg);
            color: var(--text);
            padding-bottom: calc(74px + env(safe-area-inset-bottom, 0px));
            min-height: 100vh;
            line-height: 1.4;
            -webkit-font-smoothing: antialiased;
            transition: background 0.25s, color 0.25s;
        }
        ::selection {
            background: var(--gold-soft);
        }
        .header {
            background: var(--bg-elevated);
            padding: 16px 18px;
            border-bottom: 1px solid var(--border);
            box-shadow: 0 1px 0 var(--gold-glow);
            position: sticky;
            top: 0;
            z-index: 10;
            backdrop-filter: blur(10px);
        }
        .header input {
            background: none;
            border: none;
            color: var(--text);
            font-size: 19px;
            font-weight: 700;
            letter-spacing: 0.2px;
            width: 100%;
            outline: none;
        }
        .header input::placeholder {
            color: var(--text-dim);
            font-weight: 600;
        }
        .stats {
            display: flex;
            justify-content: space-around;
            background: var(--bg-elevated);
            padding: 12px 8px;
            font-size: 11px;
            color: var(--text-dim);
            border-bottom: 1px solid var(--border);
        }
        .stats > div {
            flex: 1;
            text-align: center;
            padding: 0 4px;
            border-right: 1px solid var(--border);
        }
        .stats > div:last-child {
            border-right: none;
        }
        .stats span {
            display: block;
            font-size: 15px;
            font-weight: 700;
            color: var(--text);
            margin-top: 3px;
            letter-spacing: 0.2px;
        }
        .stats .gold {
            color: var(--gold);
        }
        .stats .green {
            color: var(--green);
        }
        .stats .red {
            color: var(--red);
        }
        .container {
            max-width: 560px;
            margin: 0 auto;
            padding: 14px 14px 4px;
        }
        @media (min-width: 640px) {
            .container {
                max-width: 620px;
                padding: 20px 20px 4px;
            }
            .header, .stats {
                padding-left: max(18px, calc((100% - 620px) / 2 + 18px));
                padding-right: max(18px, calc((100% - 620px) / 2 + 18px));
            }
        }
        .card {
            background: var(--surface);
            border: var(--card-border-width) solid var(--border);
            border-radius: var(--radius-md);
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: var(--shadow-card);
            transition: border-radius 0.2s, box-shadow 0.2s;
        }
        .card-title {
            font-size: 13px;
            font-weight: var(--title-weight);
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: var(--title-tracking);
            color: var(--text-dim);
        }
        input,
        select {
            width: 100%;
            padding: 11px 13px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text);
            font-size: 14.5px;
            outline: none;
            font-family: inherit;
            transition: border-color 0.15s, background 0.15s;
        }
        input:focus,
        select:focus {
            border-color: var(--gold);
            background: var(--gold-soft);
        }
        input::placeholder {
            color: var(--text-dim);
        }
        select option {
            background: var(--bg-elevated);
        }
        .field {
            margin-top: 12px;
        }
        .field label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-dim);
            margin-bottom: 5px;
            letter-spacing: 0.2px;
        }
        .btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
            transition: transform 0.08s, opacity 0.15s, filter 0.15s;
            font-family: inherit;
            letter-spacing: 0.2px;
        }
        .btn:active {
            transform: scale(0.98);
            filter: brightness(0.92);
        }
        .btn-primary {
            background: var(--gold);
            background: linear-gradient(135deg, color-mix(in srgb, var(--gold) 78%, white), var(--gold));
            color: var(--on-accent);
        }
        .btn-success {
            background: var(--green);
            background: linear-gradient(135deg, color-mix(in srgb, var(--green) 78%, white), var(--green));
            color: var(--on-accent);
        }
        .btn-danger {
            background: var(--red);
            background: linear-gradient(135deg, color-mix(in srgb, var(--red) 78%, white), var(--red));
            color: var(--on-accent);
        }
        .btn-outline {
            background: transparent;
            color: var(--text-dim);
            border: 1px solid var(--border-strong);
        }
        .btn-outline:active {
            background: var(--surface-hover);
        }
        .btn-small {
            width: auto;
            padding: 7px 12px;
            font-size: 11px;
            margin-top: 0;
        }
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .grid-3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }
        @media (max-width: 340px) {
            .grid-2, .grid-3 {
                grid-template-columns: 1fr;
            }
        }
        .result-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 11px 13px;
            background: var(--surface);
            border-radius: var(--radius-sm);
            margin-bottom: 6px;
            cursor: pointer;
            border: 1px solid transparent;
            transition: border-color 0.15s, background 0.15s;
        }
        .result-item:hover, .result-item:active {
            border-color: var(--gold);
            background: var(--gold-soft);
        }
        .result-item .price {
            color: var(--gold);
            font-weight: 700;
            white-space: nowrap;
            padding-left: 10px;
        }
        .result-item .stock-tag {
            font-size: 10px;
            color: var(--text-dim);
            display: block;
            margin-top: 2px;
        }
        .stock-low {
            color: var(--red) !important;
            font-weight: 700;
        }
        .search-results {
            max-height: 200px;
            overflow-y: auto;
            margin-top: 10px;
        }
        .search-wrap {
            position: relative;
        }
        .search-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            margin-top: 8px;
            background: var(--bg-elevated);
            border: 1px solid var(--border-strong);
            border-radius: var(--radius-md);
            max-height: 260px;
            overflow-y: auto;
            z-index: 30;
            box-shadow: var(--shadow-pop);
            padding: 7px;
        }
        .search-dropdown .result-item {
            margin-bottom: 5px;
        }
        .search-dropdown .result-item:last-child {
            margin-bottom: 0;
        }
        .selected-panel {
            margin-top: 14px;
            padding: 16px;
            border: 1px solid var(--green);
            border-radius: var(--radius-md);
            background: var(--green-soft);
        }
        .selected-panel .pname {
            font-size: 17px;
            font-weight: 700;
        }
        .selected-panel .pinfo {
            font-size: 12px;
            color: var(--text-dim);
            margin: 5px 0 12px;
        }
        .selected-panel .pinfo button {
            background: none;
            border: none;
            color: var(--gold);
            text-decoration: underline;
            cursor: pointer;
            font-size: 12px;
            font-family: inherit;
        }
        .amount-input {
            text-align: center;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 0.3px;
        }
        .mode-toggle {
            display: flex;
            gap: 6px;
            margin-bottom: 12px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 3px;
        }
        .mode-toggle button {
            flex: 1;
            border: none;
            background: transparent;
            color: var(--text-dim);
            font-family: inherit;
            font-size: 13px;
            font-weight: 600;
            padding: 8px 6px;
            border-radius: calc(var(--radius-sm) - 3px);
            cursor: pointer;
        }
        .mode-toggle button.active {
            background: var(--gold);
            color: var(--on-accent);
        }
        .row-line {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px solid var(--border);
            font-size: 13px;
        }
        .row-line:last-child {
            border-bottom: none;
        }
        .list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
            font-size: 13px;
            gap: 8px;
        }
        .list-item:last-child {
            border-bottom: none;
        }
        .list-item .left {
            flex: 1;
            cursor: pointer;
            min-width: 0;
        }
        .list-item .name {
            font-weight: 600;
            overflow-wrap: anywhere;
        }
        .list-item .sub {
            font-size: 11px;
            color: var(--text-dim);
            margin-top: 2px;
        }
        .list-item .right {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }
        .del-btn, .edit-btn, .bill-btn, .restock-btn {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 7px;
            width: 30px;
            height: 30px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.15s;
        }
        .del-btn {
            color: var(--red);
        }
        .del-btn:active {
            background: var(--red-soft);
        }
        .edit-btn {
            color: var(--blue);
        }
        .edit-btn:active {
            background: var(--blue-soft);
        }
        .bill-btn {
            color: var(--gold);
        }
        .bill-btn:active {
            background: var(--gold-soft);
        }
        .restock-btn {
            color: var(--green);
        }
        .restock-btn:active {
            background: var(--green-soft);
        }
        .profit-pos {
            color: var(--green);
            font-weight: 700;
        }
        .profit-neg {
            color: var(--red);
            font-weight: 700;
        }
        .empty-state {
            text-align: center;
            padding: 24px 12px;
            color: var(--text-dim);
            font-size: 13px;
        }
        .loading-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-dim);
            font-size: 14px;
        }
        .spinner {
            width: 28px;
            height: 28px;
            border: 3px solid var(--gold-soft);
            border-top-color: var(--gold);
            border-radius: 50%;
            margin: 0 auto 12px;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .type-toggle {
            display: flex;
            gap: 8px;
            margin: 10px 0 4px;
        }
        .type-toggle button {
            flex: 1;
            padding: 9px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-strong);
            background: transparent;
            color: var(--text-dim);
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
            font-family: inherit;
        }
        .type-toggle .active-credit {
            border-color: var(--red);
            color: var(--red);
            background: var(--red-soft);
        }
        .type-toggle .active-payment {
            border-color: var(--green);
            color: var(--green);
            background: var(--green-soft);
        }
        .customer-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 11px 13px;
            background: var(--surface);
            border-radius: var(--radius-sm);
            margin-bottom: 6px;
            cursor: pointer;
            border: 1px solid transparent;
            transition: border-color 0.15s;
        }
        .customer-row:hover, .customer-row:active {
            border-color: var(--gold);
        }
        .customer-row .cname {
            font-weight: 600;
        }
        .customer-row .cbal {
            font-weight: 700;
        }
        .filter-bar {
            display: flex;
            gap: 7px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        .filter-bar input {
            flex: 1;
            padding: 7px 10px;
            font-size: 12px;
            min-width: 100px;
        }
        .filter-bar button {
            padding: 7px 13px;
            border: none;
            border-radius: var(--radius-sm);
            font-weight: 700;
            font-size: 11px;
            cursor: pointer;
            background: var(--gold);
            color: var(--on-accent);
            font-family: inherit;
        }
        .date-range {
            display: flex;
            gap: 7px;
            flex-wrap: wrap;
            align-items: center;
        }
        .date-range input {
            flex: 1;
            min-width: 100px;
            padding: 7px 10px;
            font-size: 12px;
        }
        .date-range button {
            padding: 7px 13px;
            border: 1px solid var(--border-strong);
            border-radius: var(--radius-sm);
            background: transparent;
            color: var(--text);
            cursor: pointer;
            font-size: 11px;
            font-family: inherit;
        }
        .summary-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 12px;
        }
        .stat-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 12px 10px;
            text-align: center;
        }
        .stat-card .label {
            font-size: 10px;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }
        .stat-card .value {
            font-size: 17px;
            font-weight: 700;
            margin-top: 4px;
        }
        .stat-card.gold .value {
            color: var(--gold);
        }
        .stat-card.green .value {
            color: var(--green);
        }
        .stat-card.red .value {
            color: var(--red);
        }
        .section-label {
            font-weight: 700;
            font-size: 13px;
            margin: 16px 0 8px 2px;
            color: var(--text);
        }
        .rank-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--gold-soft);
            color: var(--gold);
            font-size: 11px;
            font-weight: 700;
            margin-right: 8px;
        }
        .tabbar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--bg-elevated);
            backdrop-filter: blur(12px);
            display: flex;
            justify-content: center;
            padding: 8px max(4px, env(safe-area-inset-left)) calc(8px + env(safe-area-inset-bottom, 0px)) max(4px, env(safe-area-inset-right));
            border-top: 1px solid var(--border);
            z-index: 50;
            box-shadow: var(--shadow-bar);
        }
        .tab-btn {
            background: none;
            border: none;
            color: var(--text-dim);
            font-size: 9.5px;
            font-weight: 600;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            padding: 6px 4px;
            cursor: pointer;
            font-family: inherit;
            border-radius: var(--radius-sm);
            flex: 1;
            max-width: 90px;
            transition: color 0.15s, background 0.15s;
        }
        .tab-btn .icon {
            font-size: 17px;
        }
        .tab-btn.active {
            color: var(--gold);
            background: var(--gold-soft);
        }
        .toast {
            position: fixed;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 18, 30, 0.96);
            color: #ffffff;
            padding: 11px 22px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            z-index: 400;
            border: 1px solid var(--border-strong);
            box-shadow: var(--shadow-pop);
            animation: fadeIn 0.3s, fadeOut 2.5s forwards 0.3s;
            max-width: 90%;
            text-align: center;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }
        @keyframes fadeOut {
            0% {
                opacity: 1;
            }
            80% {
                opacity: 1;
            }
            100% {
                opacity: 0;
                visibility: hidden;
            }
        }
        .bill-modal, .confirm-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(4, 6, 12, 0.72);
            backdrop-filter: blur(2px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 300;
            padding: 20px;
            animation: overlayFadeIn 0.18s ease-out;
        }
        @keyframes overlayFadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes modalPopIn {
            from {
                opacity: 0;
                transform: scale(0.92) translateY(8px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }
        .confirm-modal {
            z-index: 500;
        }
        .bill-modal.closing, .confirm-modal.closing {
            animation: overlayFadeOut 0.16s ease-in forwards;
        }
        .bill-modal.closing .bill-content, .confirm-modal.closing .confirm-content {
            animation: modalPopOut 0.16s ease-in forwards;
        }
        @keyframes overlayFadeOut {
            from { opacity: 1; }
            to { opacity: 0; }
        }
        @keyframes modalPopOut {
            from { opacity: 1; transform: scale(1) translateY(0); }
            to { opacity: 0; transform: scale(0.94) translateY(6px); }
        }
        .bill-content {
            background: var(--bg-elevated);
            border: 1px solid var(--border-strong);
            border-radius: var(--radius-lg);
            max-width: 360px;
            width: 100%;
            padding: 20px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: var(--shadow-pop);
            color: var(--text);
            animation: modalPopIn 0.22s cubic-bezier(0.2, 0.8, 0.3, 1.1);
        }
        .confirm-content {
            background: var(--bg-elevated);
            border: 1px solid var(--border-strong);
            border-radius: var(--radius-lg);
            max-width: 320px;
            width: 100%;
            padding: 22px 20px 20px;
            box-shadow: var(--shadow-pop);
            text-align: center;
            color: var(--text);
            animation: modalPopIn 0.22s cubic-bezier(0.2, 0.8, 0.3, 1.1);
        }
        .confirm-content .confirm-msg {
            font-size: 14.5px;
            font-weight: 600;
            line-height: 1.5;
            margin-bottom: 16px;
            color: var(--text);
        }
        .confirm-content input {
            margin-bottom: 6px;
            text-align: center;
        }
        .confirm-actions {
            display: flex;
            gap: 10px;
            margin-top: 4px;
        }
        .confirm-actions .btn {
            margin-top: 0;
        }
        .bill-content .bill-header {
            text-align: center;
            border-bottom: 2px solid var(--gold);
            padding-bottom: 12px;
            margin-bottom: 12px;
        }
        .bill-content .bill-header h2 {
            font-size: 19px;
            color: var(--gold);
        }
        .bill-content .bill-header p {
            font-size: 11px;
            color: var(--text-dim);
        }
        .bill-doc-type {
            font-size: 11px !important;
            font-weight: 700;
            letter-spacing: 1.5px;
            color: var(--gold) !important;
            margin: 2px 0 4px;
        }
        .bill-table {

            margin: 8px 0;
            font-size: 11.5px;
        }
        .bill-table th, .bill-table td {
            padding: 6px 4px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }
        .bill-table th {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            color: var(--text-dim);
            border-bottom: 2px solid var(--gold);
        }
        .bill-table td.num, .bill-table th.num {
            text-align: right;
            white-space: nowrap;
        }
        .bill-item-note {
            font-size: 10px;
            color: var(--text-dim);
        }
        .bill-balance-box {
            margin-top: 10px;
            padding-top: 6px;
            border-top: 1px dashed var(--border-strong);
        }
        .bill-thanks {
            text-align: center;
            font-size: 12px;
            font-weight: 700;
            color: var(--gold);
            margin-top: 12px;
        }
        .bill-row {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            border-bottom: 1px solid var(--border);
            font-size: 12px;
        }
        .bill-row.total {
            font-weight: 700;
            font-size: 15px;
            border-bottom: 2px solid var(--gold);
            margin-top: 8px;
            padding-top: 8px;
        }
        .bill-actions {
            display: flex;
            gap: 8px;
            margin-top: 14px;
            flex-wrap: wrap;
        }
        .bill-actions button {
            flex: 1;
            min-width: 90px;
        }
        @media print {
            .bill-modal {
                position: static;
                background: #fff;
                padding: 0;
            }
            .bill-content {
                background: #fff;
                color: #000;
                border: none;
            }
            .bill-content .bill-header h2 {
                color: #000;
            }
            .bill-content .bill-header p {
                color: #666;
            }

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

    <div class="header">
        <input id="shopNameInput" placeholder="Enter shop name" oninput="window.onShopNameInput(this.value)" disabled>
    </div>
    <div class="save-indicator" id="saveIndicator">✓ Saved</div>

    <div class="low-stock-notice" id="lowStockNotice" style="display:none;"></div>

    <div class="stats">
        <div><span data-key="statSale">Today's Sale</span> <span class="gold" id="todaySaleStat">Rs 0</span></div>
        <div><span data-key="statProfit">Profit</span> <span class="green" id="todayProfitStat">Rs 0</span></div>
        <div><span data-key="statCredit">Credit</span> <span class="red" id="totalCreditStat">Rs 0</span></div>
    </div>

    <div class="container" id="app">
        <div class="loading-state"><div class="spinner"></div>Loading your shop data...</div>
    </div>

    <div class="tabbar">
        <button class="tab-btn active" data-tab="sale"><span class="icon">📊</span><span data-key="tabSale">Sale</span></button>
        <button class="tab-btn" data-tab="product"><span class="icon">📦</span><span data-key="tabProduct">Product</span></button>
        <button class="tab-btn" data-tab="expense"><span class="icon">💳</span><span data-key="tabExpense">Expense</span></button>
        <button class="tab-btn" data-tab="udhar"><span class="icon">🤝</span><span data-key="tabCredit">Credit</span></button>
        <button class="tab-btn" data-tab="report"><span class="icon">📈</span><span data-key="tabReport">Report</span></button>
        <button class="tab-btn" data-tab="settings"><span class="icon">⚙️</span><span data-key="tabSettings">Settings</span></button>
    </div>

    <div id="billModal" style="display:none;"></div>

    <script>
        // ============================================================
        // Make ALL functions globally accessible
        // ============================================================
        window.onShopNameInput = function(val) {
            shopName = val;
            window.saveShopName();
        };

        // ============================================================
        // STORAGE (persistent, cross-session storage)
        // Tries Claude's window.storage bridge first (used only while
        // previewing inside claude.ai). If that isn't available — which is
        // the case once this file is saved/opened as a standalone page or
        // added to the phone's home screen — it falls back to the browser's
        // own localStorage, so data survives closing and reopening the app.
        // ============================================================
        // Races a promise against a timeout so a stuck/broken storage
        // bridge (e.g. inside some webview shells) can never hang the app
        // on the loading screen forever — it just falls back to localStorage.
        function withTimeout(promise, ms) {
            return new Promise((resolve, reject) => {
                const timer = setTimeout(() => reject(new Error('storage timeout')), ms);
                promise.then(v => { clearTimeout(timer); resolve(v); }, e => { clearTimeout(timer); reject(e); });
            });
        }

        async function storageGet(key, fallback) {
            try {
                if (window.storage && typeof window.storage.get === 'function') {
                    const res = await withTimeout(window.storage.get(key, false), 3000);
                    if (res && res.value !== undefined && res.value !== null) {
                        return JSON.parse(res.value);
                    }
                    return fallback;
                }
            } catch (e) { /* fall through to localStorage */ }
            try {
                const raw = localStorage.getItem('shopLedger_' + key);
                return raw !== null ? JSON.parse(raw) : fallback;
            } catch (e2) {
                return fallback;
            }
        }

        async function storageSet(key, value) {
            let saved = false;
            try {
                if (window.storage && typeof window.storage.set === 'function') {
                    await withTimeout(window.storage.set(key, JSON.stringify(value), false), 3000);
                    saved = true;
                }
            } catch (e) { /* fall through to localStorage */ }
            if (!saved) {
                try {
                    localStorage.setItem('shopLedger_' + key, JSON.stringify(value));
                    saved = true;
                } catch (e2) {
                    console.log('Save error:', e2);
                }
            }
            if (saved) {
                flashSaveIndicator();
                const syncKeys = ['products', 'sales', 'expenses', 'udhar', 'shopName', 'lowStockThreshold'];
                if (syncKeys.includes(key) && window.cloudSyncEnabled && typeof window.scheduleCloudPush === 'function') {
                    window.scheduleCloudPush();
                }
                return true;
            }
            window.toast('⚠️ Could not save - try again');
            return false;
        }

        function flashSaveIndicator() {
            const el = document.getElementById('saveIndicator');
            if (!el) return;
            el.classList.add('show');
            clearTimeout(window._saveIndicatorTimer);
            window._saveIndicatorTimer = setTimeout(() => el.classList.remove('show'), 700);
        }

        window.saveProducts = () => storageSet('products', products);
        window.saveSales = () => storageSet('sales', sales);
        window.saveExpenses = () => storageSet('expenses', expenses);
        window.saveUdhar = () => storageSet('udhar', udhar);
        window.saveShopName = () => storageSet('shopName', shopName);
        window.saveLowStockThreshold = () => storageSet('lowStockThreshold', lowStockThreshold);
        window.saveTheme = () => storageSet('theme', currentTheme);
        window.saveLastBackup = () => storageSet('lastBackupAt', lastBackupAt);
        window.saveLang = () => storageSet('appLang', appLang);
        window.saveAll = async function() {
            await Promise.all([
                window.saveProducts(),
                window.saveSales(),
                window.saveExpenses(),
                window.saveUdhar(),
                window.saveShopName(),
                window.saveLowStockThreshold(),
                window.saveTheme(),
                window.saveLastBackup(),
                window.saveLang()
            ]);
        };

        // ============================================================
        // CLOUD SYNC (optional — Firebase Realtime Database)
        // Off by default. The person pastes their own Firebase project
        // config + picks a shared "Sync Code" (same code on both phones).
        // Whichever device saves data pushes the full ledger to
        // /shops/{syncCode} in Firebase; other devices listening on the
        // same path pick it up in real time. Whole-record last-write-wins
        // — fine for one shop's data, not built for simultaneous edits.
        // ============================================================
        window.cloudSyncEnabled = false;
        let firebaseConfigStr = '';
        let syncCode = '';
        let cloudSyncStatus = 'disconnected'; // 'disconnected' | 'connecting' | 'connected' | 'error'
        let cloudSyncError = '';
        let lastCloudSyncAt = null;
        let _dbRef = null;
        let _cloudPushTimer = null;
        let _lastPushedTs = 0;
        let _applyingRemote = false;

        window.saveCloudSyncEnabled = () => storageSet('cloudSyncEnabled', window.cloudSyncEnabled);
        window.saveFirebaseConfig = () => storageSet('firebaseConfig', firebaseConfigStr);
        window.saveSyncCode = () => storageSet('syncCode', syncCode);
        window.saveLastCloudSyncAt = () => storageSet('lastCloudSyncAt', lastCloudSyncAt);

        window.onFirebaseConfigInput = function(v) { firebaseConfigStr = v; };
        window.onSyncCodeInput = function(v) { syncCode = v; };

        window.scheduleCloudPush = function() {
            if (_applyingRemote) return; // don't echo back what we just received
            clearTimeout(_cloudPushTimer);
            _cloudPushTimer = setTimeout(window.pushToCloud, 800);
        };

        window.pushToCloud = async function() {
            if (!_dbRef) return;
            try {
                const ts = Date.now();
                _lastPushedTs = ts;
                await _dbRef.set({ products, sales, expenses, udhar, shopName, lowStockThreshold, updatedAt: ts });
                lastCloudSyncAt = ts;
                await window.saveLastCloudSyncAt();
                cloudSyncStatus = 'connected';
                if (currentTab === 'settings') window.renderSettings();
            } catch (e) {
                console.log('Cloud push error:', e);
                cloudSyncStatus = 'error';
                cloudSyncError = String(e && e.message || e);
                if (currentTab === 'settings') window.renderSettings();
            }
        };

        window.connectCloudSync = async function() {
            let cfg;
            try {
                cfg = JSON.parse(firebaseConfigStr);
            } catch (e) {
                window.toast('⚠️ Firebase config JSON galat hai');
                return;
            }
            if (!syncCode || !syncCode.trim()) {
                window.toast('⚠️ Sync Code likhein (dono phones par same hona chahiye)');
                return;
            }
            if (typeof firebase === 'undefined') {
                window.toast('⚠️ Firebase load nahi hua — internet check karein');
                return;
            }
            cloudSyncStatus = 'connecting';
            window.renderSettings();
            try {
                if (!firebase.apps || !firebase.apps.length) {
                    firebase.initializeApp(cfg);
                } else {
                    firebase.app().delete().catch(() => {});
                    firebase.initializeApp(cfg);
                }
                const db = firebase.database();
                const safeCode = syncCode.trim().replace(/[^a-zA-Z0-9_-]/g, '_');
                _dbRef = db.ref('shops/' + safeCode);

                _dbRef.on('value', (snapshot) => {
                    const val = snapshot.val();
                    if (!val) return;
                    if (!val.updatedAt || val.updatedAt === _lastPushedTs) return;
                    // Remote copy is newer than what we last pushed — apply it.
                    _applyingRemote = true;
                    products = Array.isArray(val.products) ? val.products : products;
                    sales = Array.isArray(val.sales) ? val.sales : sales;
                    expenses = Array.isArray(val.expenses) ? val.expenses : expenses;
                    udhar = Array.isArray(val.udhar) ? val.udhar : udhar;
                    shopName = typeof val.shopName === 'string' ? val.shopName : shopName;
                    lowStockThreshold = (typeof val.lowStockThreshold === 'number') ? val.lowStockThreshold : lowStockThreshold;
                    window.saveAll().finally(() => { _applyingRemote = false; });
                    lastCloudSyncAt = Date.now();
                    window.saveLastCloudSyncAt();
                    window.updateStats();
                    window.toast('🔄 Doosre phone se data sync hogaya');
                    render();
                });

                window.cloudSyncEnabled = true;
                cloudSyncStatus = 'connected';
                cloudSyncError = '';
                await Promise.all([window.saveCloudSyncEnabled(), window.saveFirebaseConfig(), window.saveSyncCode()]);
                window.toast('✅ Cloud Sync connected!');
                window.pushToCloud();
            } catch (e) {
                console.log('Cloud connect error:', e);
                cloudSyncStatus = 'error';
                cloudSyncError = String(e && e.message || e);
                window.toast('⚠️ Connect nahi ho saka: ' + cloudSyncError);
            }
            window.renderSettings();
        };

        window.disconnectCloudSync = async function() {
            if (_dbRef) { _dbRef.off(); _dbRef = null; }
            window.cloudSyncEnabled = false;
            cloudSyncStatus = 'disconnected';
            await window.saveCloudSyncEnabled();
            window.toast('Cloud Sync band kar diya');
            window.renderSettings();
        };

        // ============================================================
        // STATE
        // ============================================================
        let products = [];
        let sales = [];
        let expenses = [];
        let udhar = [];
        let shopName = '';
        let dataLoaded = false;
        let currentTab = 'sale';
        let selectedProduct = null;
        let editRates = false;
        let currentTheme = 'emerald';
        let lastBackupAt = null;
        let appLang = 'en';

        // UI vars
        let _saleQuery = '';
        let _saleAmount = '';
        let _saleQty = '';
        let _saleMode = 'amount'; // 'qty' = enter units sold, price auto-calculated | 'amount' = enter total Rs directly
        let _ratePurchase = null;
        let _rateSelling = null;
        let _focusAmount = false;
        let _prodName = '';
        let _prodPurchase = '';
        let _prodSelling = '';
        let _prodStock = '';
        let _prodMode = 'price';
        let _prodLotQty = '';
        let _prodLotTotal = '';
        let _editingProductId = null;
        let _viewingProductId = null;
        let _prodSearchQuery = '';
        let lowStockThreshold = 5;
        let _expDesc = '';
        let _expAmount = '';
        let _expDate = '';
        let _udharCustomer = '';
        let _udharAmount = '';
        let _udharNote = '';
        let _udharProduct = '';
        let _udharProfit = '';
        let _udharDropdownOpen = false;
        let _udharCustomerSearch = '';
        let _saleDropdownOpen = false;
        let saleFilterDate = '';
        let expenseFilterDate = '';
        let reportStart = '';
        let reportEnd = '';
        let udharType = 'credit';
        let _udharActiveCustomer = null;
        let _udharStartName = '';
        let _udharStartNote = '';
        let _focusUdharAmount = false;

        const app = document.getElementById('app');

        // ============================================================
        // HELPERS
        // ============================================================
        window.uid = function() {
            return Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
        };

        // ------------------------------------------------------------
        // Core helpers: HTML escaping, number/date formatting, toast
        // notifications, tab switching, and the header stats bar.
        // (These were missing entirely, which is why the app could get
        // stuck on "Loading your shop data..." forever — init() called
        // window.updateStats() before render(), and since updateStats
        // didn't exist, that threw and stopped init() right there.)
        // ------------------------------------------------------------
        window.esc = function(s) {
            if (s === null || s === undefined) return '';
            return String(s)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        };
        window.escAttr = window.esc;

        window.fmt = function(n) {
            const num = parseFloat(n);
            if (isNaN(num)) return '0';
            const rounded = Math.round(num * 100) / 100;
            const parts = rounded.toFixed(Math.abs(rounded % 1) > 0.001 ? 2 : 0).split('.');
            parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
            return parts.join('.');
        };

        window.fmtQty = function(n) {
            const num = parseFloat(n);
            if (isNaN(num)) return '0';
            let s = num.toFixed(2);
            s = s.replace(/\.?0+$/, '');
            return s;
        };

        window.today = function() {
            const d = new Date();
            const yyyy = d.getFullYear();
            const mm = String(d.getMonth() + 1).padStart(2, '0');
            const dd = String(d.getDate()).padStart(2, '0');
            return `${yyyy}-${mm}-${dd}`;
        };

        window.toast = function(msg) {
            const existing = document.querySelectorAll('.toast');
            existing.forEach(t => t.remove());
            const el = document.createElement('div');
            el.className = 'toast';
            el.textContent = msg;
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 2800);
        };

        window.setTheme = async function(theme) {
            if (!['emerald', 'ocean', 'sunset', 'midnight'].includes(theme)) return;
            currentTheme = theme;
            document.documentElement.setAttribute('data-theme', theme);
            const bgColors = { emerald: '#f2f7f5', ocean: '#eef6fb', sunset: '#fdf5ef', midnight: '#0b0e17' };
            const themeMeta = document.getElementById('themeColorMeta');
            if (themeMeta) themeMeta.setAttribute('content', bgColors[theme] || '#f2f7f5');
            await window.saveTheme();
            render();
        };

        window.switchTab = function(tab) {
            currentTab = tab;
            // Leave stale detail views behind when navigating away.
            _viewingProductId = null;
            _editingProductId = null;
            render();
        };

        // Updates the always-visible header stats bar (today's cash sale,
        // today's cash profit, and total outstanding credit). Credit-sale
        // profit is intentionally NOT included here — it stays inside the
        // Credit tab, not mixed into the shop's general profit numbers.
        window.updateStats = function() {
            const t = window.today();
            const todaySales = sales.filter(s => s.date === t);
            const todaySaleAmt = todaySales.reduce((a, s) => a + s.amount, 0);
            const todayProfitAmt = todaySales.reduce((a, s) => a + s.profit, 0);

            const custMap = {};
            udhar.forEach(u => {
                if (!custMap[u.customer]) custMap[u.customer] = { credit: 0, payment: 0 };
                if (u.type === 'credit') custMap[u.customer].credit += u.amount;
                else custMap[u.customer].payment += u.amount;
            });
            const totalCredit = Object.values(custMap).reduce((a, c) => a + Math.max(0, c.credit - c.payment), 0);

            const saleEl = document.getElementById('todaySaleStat');
            const profitEl = document.getElementById('todayProfitStat');
            const creditEl = document.getElementById('totalCreditStat');
            if (saleEl) saleEl.textContent = 'Rs ' + window.fmt(todaySaleAmt);
            if (profitEl) profitEl.textContent = 'Rs ' + window.fmt(todayProfitAmt);
            if (creditEl) creditEl.textContent = 'Rs ' + window.fmt(totalCredit);

            window.renderLowStockNotice();
        };

        // ------------------------------------------------------------
        // Low-stock notice: a small, dismissible one-line pill instead of
        // a full card of every low-stock product taking over the screen.
        // Tapping it expands a short dropdown list; it stays out of the
        // way otherwise.
        // ------------------------------------------------------------
        let _lowStockExpanded = false;
        window.renderLowStockNotice = function() {
            const el = document.getElementById('lowStockNotice');
            if (!el) return;
            const low = products.filter(p => p.stock != null && p.stock <= lowStockThreshold);
            if (!low.length) { el.style.display = 'none'; el.innerHTML = ''; return; }
            el.style.display = 'block';
            el.innerHTML = `
                <div class="low-stock-pill" onclick="window.toggleLowStockNotice()">
                    <span>⚠️ ${low.length} ${low.length === 1 ? window.tt('item low on stock', 'item kam stock mein') : window.tt('items low on stock', 'items kam stock mein')}</span>
                    <span class="chev">${_lowStockExpanded ? '▲' : '▼'}</span>
                </div>
                ${_lowStockExpanded ? `
                    <div class="low-stock-drop">
                        ${low.map(p => `<div class="row-line"><span>${window.esc(p.name)}</span><span class="stock-low">${window.fmtQty(p.stock)} left</span></div>`).join('')}
                    </div>
                ` : ''}
            `;
        };
        window.toggleLowStockNotice = function() {
            _lowStockExpanded = !_lowStockExpanded;
            window.renderLowStockNotice();
        };

        // ------------------------------------------------------------
        // Custom confirm/prompt dialogs. Native confirm()/prompt() can be
        // silently blocked (always returning false/null with no error) in
        // sandboxed webviews, which made delete buttons look "broken" even
        // though the delete code itself was fine. These render our own
        // themed modal instead, so they always work everywhere, including
        // as a home-screen PWA.
        // ------------------------------------------------------------
        window.confirmDialog = function(message, opts) {
            opts = opts || {};
            return new Promise((resolve) => {
                const modal = document.createElement('div');
                modal.className = 'confirm-modal';
                modal.innerHTML = `
                    <div class="confirm-content">
                        <div class="confirm-msg">${window.esc(message)}</div>
                        <div class="confirm-actions">
                            <button class="btn btn-outline" id="_confirmCancelBtn">Cancel</button>
                            <button class="btn ${opts.danger ? 'btn-danger' : 'btn-primary'}" id="_confirmOkBtn">${window.esc(opts.okLabel || 'Delete')}</button>
                        </div>
                    </div>
                `;
                document.body.appendChild(modal);
                const cleanup = (result) => {
                    modal.classList.add('closing');
                    setTimeout(() => { modal.remove(); resolve(result); }, 160);
                };
                modal.addEventListener('click', (e) => { if (e.target === modal) cleanup(false); });
                document.getElementById('_confirmCancelBtn').onclick = () => cleanup(false);
                document.getElementById('_confirmOkBtn').onclick = () => cleanup(true);
            });
        };

        window.promptDialog = function(message, defaultValue) {
            return new Promise((resolve) => {
                const modal = document.createElement('div');
                modal.className = 'confirm-modal';
                modal.innerHTML = `
                    <div class="confirm-content">
                        <div class="confirm-msg">${window.esc(message)}</div>
                        <input type="number" id="_promptInput" autocomplete="off" value="${window.escAttr(defaultValue != null ? defaultValue : '')}">
                        <div class="confirm-actions">
                            <button class="btn btn-outline" id="_promptCancelBtn">Cancel</button>
                            <button class="btn btn-primary" id="_promptOkBtn">OK</button>
                        </div>
                    </div>
                `;
                document.body.appendChild(modal);
                const input = modal.querySelector('#_promptInput');
                setTimeout(() => { input.focus(); input.select(); }, 50);
                const cleanup = (result) => {
                    modal.classList.add('closing');
                    setTimeout(() => { modal.remove(); resolve(result); }, 160);
                };
                modal.addEventListener('click', (e) => { if (e.target === modal) cleanup(null); });
                input.addEventListener('keydown', (e) => { if (e.key === 'Enter') cleanup(input.value); });
                document.getElementById('_promptCancelBtn').onclick = () => cleanup(null);
                document.getElementById('_promptOkBtn').onclick = () => cleanup(input.value);
            });
        };

        // ------------------------------------------------------------
        // Language: translates the app's main chrome (tab bar, stats
        // bar, Settings screen). Sale/Product/Expense/Credit forms stay
        // in the app's existing Roman Urdu/English mix, since fully
        // translating every dynamic label across the app is a much
        // bigger job — this covers what's visible everywhere, all the
        // time.
        // ------------------------------------------------------------
        window.translations = {
            en: {
                tabSale: 'Sale', tabProduct: 'Product', tabExpense: 'Expense', tabCredit: 'Credit',
                tabReport: 'Report', tabSettings: 'Settings',
                statSale: "Today's Sale", statProfit: 'Profit', statCredit: 'Credit',
                settingsTitle: 'Settings', themeLabel: 'Theme', languageLabel: 'Language',
                shopNameLabel: 'Shop Name', lowStockLabel: 'Low Stock Alert (units)',
                exportBtn: 'Export Data (backup file)', importBtn: 'Import Data',
                deleteAllBtn: 'Delete All Data', backupTitle: 'Backup Reminder'
            },
            ur: {
                tabSale: 'فروخت', tabProduct: 'مصنوعات', tabExpense: 'اخراجات', tabCredit: 'ادھار',
                tabReport: 'رپورٹ', tabSettings: 'ترتیبات',
                statSale: 'آج کی فروخت', statProfit: 'منافع', statCredit: 'ادھار',
                settingsTitle: 'ترتیبات', themeLabel: 'تھیم', languageLabel: 'زبان',
                shopNameLabel: 'دکان کا نام', lowStockLabel: 'کم اسٹاک وارننگ (یونٹس)',
                exportBtn: '📤 ڈیٹا ایکسپورٹ کریں (بیک اپ)', importBtn: '📥 ڈیٹا امپورٹ کریں',
                deleteAllBtn: '🗑️ تمام ڈیٹا حذف کریں', backupTitle: 'بیک اپ یاد دہانی'
            },
            sd: {
                tabSale: 'وڪرو', tabProduct: 'شيون', tabExpense: 'خرچ', tabCredit: 'قرض',
                tabReport: 'رپورٽ', tabSettings: 'سيٽنگون',
                statSale: 'اڄ جو وڪرو', statProfit: 'منافعو', statCredit: 'قرض',
                settingsTitle: 'سيٽنگون', themeLabel: 'ٿيم', languageLabel: 'ٻولي',
                shopNameLabel: 'دڪان جو نالو', lowStockLabel: 'گھٽ اسٽاڪ وارننگ (يونٽ)',
                exportBtn: '📤 ڊيٽا ايڪسپورٽ ڪريو (بيڪ اپ)', importBtn: '📥 ڊيٽا امپورٽ ڪريو',
                deleteAllBtn: '🗑️ سڀ ڊيٽا ختم ڪريو', backupTitle: 'بيڪ اپ ياد ڏياري'
            }
        };

        window.t = function(key) {
            return (window.translations[appLang] && window.translations[appLang][key])
                || window.translations.en[key] || key;
        };

        // Quick inline translator for strings that don't need a full
        // dictionary entry: English text vs. the app's existing Roman
        // Urdu/Hindi phrasing (used for 'ur' and 'sd' too, since a full
        // native-script translation of every dynamic label is a much
        // larger job than this covers).
        window.tt = function(en, roman) {
            return appLang === 'en' ? en : (roman || en);
        };

        // Updates every [data-key] element on the page (tab bar, stats bar)
        // to the active language. Settings-tab text is translated directly
        // inside renderSettings() since that markup is rebuilt each time.
        window.applyTranslations = function() {
            document.querySelectorAll('[data-key]').forEach(el => {
                el.textContent = window.t(el.getAttribute('data-key'));
            });
        };

        window.setLang = async function(lang) {
            if (!['en', 'ur', 'sd'].includes(lang)) return;
            appLang = lang;
            await window.saveLang();
            window.applyTranslations();
            if (currentTab === 'settings') render();
            window.toast('🌐 Language changed');
        };

        // ============================================================
        // RENDER
        // ============================================================
        function render() {
            if (!dataLoaded) return;
            document.querySelectorAll('.tab-btn').forEach(b => {
                b.classList.toggle('active', b.dataset.tab === currentTab);
            });
            window.renderLowStockNotice();

            if (currentTab === 'sale') renderSale();
            else if (currentTab === 'product') renderProduct();
            else if (currentTab === 'expense') renderExpense();
            else if (currentTab === 'udhar') renderUdhar();
            else if (currentTab === 'report') renderReport();
            else renderSettings();
        }

        // ============================================================
        // SALE TAB
        // ============================================================
        window.renderSale = function() {
            const q = _saleQuery || '';
            const filtered = q ? products.filter(p => p.name.toLowerCase().includes(q.toLowerCase())) : products;

            let selPanel = '';
            if (selectedProduct) {
                const p = selectedProduct;
                const rpp = _ratePurchase != null ? _ratePurchase : p.purchasePrice;
                const rsp = _rateSelling != null ? _rateSelling : p.sellingPrice;
                const margin = rsp > 0 ? (((rsp - rpp) / rsp) * 100) : 0;
                const qtyNum = parseFloat(_saleQty);
                const amtNum = parseFloat(_saleAmount);
                const amt = _saleMode === 'qty' ? (!isNaN(qtyNum) && qtyNum > 0 ? qtyNum * rsp : NaN) : amtNum;
                const valid = !isNaN(amt) && rsp > 0;
                const cost = valid ? amt * (rpp / rsp) : 0;
                const profit = valid ? amt - cost : 0;
                const estUnits = _saleMode === 'qty' ? (!isNaN(qtyNum) ? qtyNum : 0) : (valid && rsp > 0 ? (amt / rsp) : 0);
                const stockLine = (p.stock != null) ? `<div class="row-line"><span>Stock left</span><span class="${p.stock<=lowStockThreshold?'stock-low':''}">${window.fmtQty(p.stock)} units <span id="stockAfterVal">${valid?('→ ~'+ window.fmtQty(Math.max(p.stock-estUnits,0))+' after sale'):''}</span></span></div>` : '';

                selPanel = `
                    <div class="selected-panel">
                        <div class="pname">${window.esc(p.name)}</div>
                        <div class="pinfo">
                            Purchase: <span id="purchaseVal">Rs ${window.fmt(rpp)}</span> · Selling: <span id="sellingVal">Rs ${window.fmt(rsp)}</span> · Margin: <span id="marginText">${margin.toFixed(1)}%</span>
                            <button onclick="window.toggleEditRates()">${editRates ? 'hide' : 'change rates?'}</button>
                        </div>
                        ${editRates ? `
                            <div class="grid-2">
                                <div class="field"><label>Purchase</label><input type="number" id="ratePurchase" autocomplete="off" value="${rpp}" oninput="window.onRateInput()"></div>
                                <div class="field"><label>Selling</label><input type="number" id="rateSelling" autocomplete="off" value="${rsp}" oninput="window.onRateInput()"></div>
                            </div>
                        ` : ''}
                        <div class="mode-toggle">
                            <button class="${_saleMode==='qty'?'active':''}" onclick="window.setSaleMode('qty')">By Quantity</button>
                            <button class="${_saleMode==='amount'?'active':''}" onclick="window.setSaleMode('amount')">By Amount</button>
                        </div>
                        ${_saleMode === 'qty' ? `
                            <div class="field">
                                <label>Quantity Sold</label>
                                <input class="amount-input" type="number" id="saleQty" autocomplete="off" placeholder="e.g. 1, 2, 4" value="${_saleQty}" oninput="window.onQtyInput(this.value)">
                            </div>
                            <div class="row-line"><span>Amount</span><span id="amountVal">Rs ${window.fmt(valid ? amt : 0)}</span></div>
                        ` : `
                            <div class="field">
                                <label>Amount (Rs)</label>
                                <input class="amount-input" type="number" id="saleAmount" autocomplete="off" placeholder="0" value="${_saleAmount}" oninput="window.onAmountInput(this.value)">
                            </div>
                        `}
                        <div class="row-line"><span>Cost</span><span id="costVal">Rs ${window.fmt(cost)}</span></div>
                        <div class="row-line"><span>Profit</span><span id="profitVal" style="color:${profit>=0?'var(--green)':'var(--red)'}">Rs ${window.fmt(profit)}</span></div>
                        ${stockLine}
                        <div class="field"><label>Date</label><input type="date" id="saleDate" value="${window.today()}"></div>
                        <button class="btn btn-primary" onclick="window.confirmSale()">✔ Confirm Sale</button>
                        <button class="btn btn-outline" onclick="window.cancelSelect()">Cancel</button>
                    </div>
                `;
            }

            const fd = saleFilterDate || window.today();
            const fs = sales.filter(s => s.date === fd);
            const dayTotal = fs.reduce((a, s) => a + s.amount, 0);
            const dayProfit = fs.reduce((a, s) => a + s.profit, 0);

            const listHtml = fs.length ? fs.map(s => `
                <div class="list-item">
                    <div class="left">
                        <div class="name">${window.esc(s.productName)}</div>
                        <div class="sub">${s.date} · Rs ${window.fmt(s.amount)} @ rate Rs ${window.fmt(s.sellingRate)}</div>
                    </div>
                    <div class="right">
                        <span class="${s.profit>=0?'profit-pos':'profit-neg'}">Rs ${window.fmt(s.profit)}</span>
                        <button class="del-btn" onclick="window.deleteSale('${s.id}')">✕</button>
                    </div>
                </div>
            `).join('') : '<div class="empty-state">No sales for this date</div>';

            app.innerHTML = `
                <div class="card">
                    <div class="card-title">🔍 Search Product</div>
                    <div class="search-wrap">
                        <input class="search-input" id="saleSearchInput" autocomplete="off" placeholder="Type product name..." value="${window.escAttr(q)}"
                            oninput="window.onSearchInput(this.value)"
                            onfocus="window.onSearchFocus()"
                            onblur="window.onSearchBlur()">
                        <div class="search-dropdown" id="dropdownContainer" style="display:${_saleDropdownOpen ? 'block' : 'none'}"></div>
                    </div>
                    ${selPanel}
                </div>
                <div class="section-label">📅 ${fd} <span style="font-weight:400;color:var(--text-dim);font-size:12px;">(Total: Rs ${window.fmt(dayTotal)} | Profit: Rs ${window.fmt(dayProfit)})</span></div>
                <div class="card">
                    <div class="filter-bar">
                        <input type="date" value="${fd}" onchange="saleFilterDate=this.value;window.renderSale();">
                        <button onclick="saleFilterDate=window.today();window.renderSale();">Today</button>
                        <button onclick="window.handleClearDaySales('${fd}')" style="background:var(--red);color:var(--on-accent);">Clear</button>
                    </div>
                    <div class="scrollable">${listHtml}</div>
                </div>
            `;

            window.updateSaleDropdown();

            if (selectedProduct) {
                const amtBox = document.getElementById(_saleMode === 'qty' ? 'saleQty' : 'saleAmount');
                if (amtBox && _focusAmount) {
                    setTimeout(() => { amtBox.focus();
                        amtBox.select(); }, 100);
                    _focusAmount = false;
                }
            }
        };

        // Updates only the dropdown suggestion list in place, without
        // touching the search <input> itself — keeps the mobile keyboard open.
        window.updateSaleDropdown = function() {
            const container = document.getElementById('dropdownContainer');
            if (!container) return;
            container.style.display = _saleDropdownOpen ? 'block' : 'none';
            if (!_saleDropdownOpen) { container.innerHTML = ''; return; }
            const q = _saleQuery || '';
            const filtered = q ? products.filter(p => p.name.toLowerCase().includes(q.toLowerCase())) : products;
            container.innerHTML = products.length === 0 ? '<div class="empty-state">Add products first</div>' :
                filtered.length === 0 ? '<div class="empty-state">No product found</div>' :
                filtered.map(p => `
                    <div class="result-item" onmousedown="event.preventDefault();window.selectProduct('${p.id}')">
                        <span>${window.esc(p.name)}${p.stock!=null?`<span class="stock-tag ${p.stock<=lowStockThreshold?'stock-low':''}">${window.fmtQty(p.stock)} in stock</span>`:''}</span>
                        <span class="price">Rs ${window.fmt(p.sellingPrice)}</span>
                    </div>
                `).join('');
        };

        // Recomputes cost/profit/margin/stock-after preview and updates just
        // those spans directly (no innerHTML rebuild), so the amount/rate
        // input the person is typing into is never replaced mid-keystroke.
        window.updateSaleCalc = function() {
            if (!selectedProduct) return;
            const p = selectedProduct;
            const rpp = _ratePurchase != null ? _ratePurchase : p.purchasePrice;
            const rsp = _rateSelling != null ? _rateSelling : p.sellingPrice;
            const margin = rsp > 0 ? (((rsp - rpp) / rsp) * 100) : 0;
            const qtyNum = parseFloat(_saleQty);
            const amtNum = parseFloat(_saleAmount);
            const amt = _saleMode === 'qty' ? (!isNaN(qtyNum) && qtyNum > 0 ? qtyNum * rsp : NaN) : amtNum;
            const valid = !isNaN(amt) && rsp > 0;
            const cost = valid ? amt * (rpp / rsp) : 0;
            const profit = valid ? amt - cost : 0;
            const estUnits = _saleMode === 'qty' ? (!isNaN(qtyNum) ? qtyNum : 0) : (valid && rsp > 0 ? (amt / rsp) : 0);

            const set = (id, text) => { const el = document.getElementById(id); if (el) el.textContent = text; };
            set('purchaseVal', 'Rs ' + window.fmt(rpp));
            set('sellingVal', 'Rs ' + window.fmt(rsp));
            set('marginText', margin.toFixed(1) + '%');
            set('amountVal', 'Rs ' + window.fmt(valid ? amt : 0));
            set('costVal', 'Rs ' + window.fmt(cost));
            const profitEl = document.getElementById('profitVal');
            if (profitEl) {
                profitEl.textContent = 'Rs ' + window.fmt(profit);
                profitEl.style.color = profit >= 0 ? 'var(--green)' : 'var(--red)';
            }
            if (p.stock != null) {
                set('stockAfterVal', valid ? ('→ ~' + window.fmtQty(Math.max(p.stock - estUnits, 0)) + ' after sale') : '');
            }
        };

        window.onSearchInput = function(v) {
            _saleQuery = v;
            _saleDropdownOpen = true;
            window.updateSaleDropdown();
        };
        window.onSearchFocus = function() {
            _saleDropdownOpen = true;
            window.updateSaleDropdown();
        };
        window.onSearchBlur = function() {
            // small delay so a tap on a dropdown item still registers first
            setTimeout(() => {
                _saleDropdownOpen = false;
                window.updateSaleDropdown();
            }, 180);
        };
        window.onAmountInput = function(v) { _saleAmount = v;
            window.updateSaleCalc(); };
        window.onQtyInput = function(v) { _saleQty = v;
            window.updateSaleCalc(); };
        window.setSaleMode = function(m) { _saleMode = m;
            renderSale();
            setTimeout(() => { const el = document.getElementById(m === 'qty' ? 'saleQty' : 'saleAmount'); if (el) el.focus(); }, 50); };
        window.onRateInput = function() {
            _ratePurchase = parseFloat(document.getElementById('ratePurchase').value);
            _rateSelling = parseFloat(document.getElementById('rateSelling').value);
            window.updateSaleCalc();
        };
        window.toggleEditRates = function() { editRates = !editRates;
            renderSale(); };
        window.selectProduct = function(id) {
            selectedProduct = products.find(p => p.id === id);
            _saleAmount = '';
            _saleQty = '';
            _ratePurchase = null;
            _rateSelling = null;
            _focusAmount = true;
            editRates = false;
            _saleDropdownOpen = false;
            _saleQuery = '';
            renderSale();
        };
        window.cancelSelect = function() { selectedProduct = null;
            _saleAmount = '';
            _saleQty = '';
            renderSale(); };
        window.confirmSale = async function() {
            if (!selectedProduct) { window.toast('Select a product');
                return; }
            const p = selectedProduct;
            const rpp = _ratePurchase != null ? _ratePurchase : p.purchasePrice;
            const rsp = _rateSelling != null ? _rateSelling : p.sellingPrice;
            if (rsp <= 0) { window.toast('Selling price must be > 0');
                return; }
            let amt;
            if (_saleMode === 'qty') {
                const qty = parseFloat(document.getElementById('saleQty').value);
                if (isNaN(qty) || qty <= 0) { window.toast('Enter valid quantity');
                    return; }
                amt = qty * rsp;
            } else {
                amt = parseFloat(document.getElementById('saleAmount').value);
                if (isNaN(amt) || amt <= 0) { window.toast('Enter valid amount');
                    return; }
            }
            const cost = amt * (rpp / rsp);
            const profit = amt - cost;
            const date = document.getElementById('saleDate').value || window.today();
            sales.push({ id: window.uid(), productId: p.id, productName: p.name, amount: amt, cost: cost, profit: profit,
                purchaseRate: rpp, sellingRate: rsp, date: date, timestamp: Date.now() });

            let stockChanged = false;
            const prodRef = products.find(pr => pr.id === p.id);
            if (prodRef && prodRef.stock != null) {
                const unitsSold = amt / rsp;
                prodRef.stock = Math.max(0, +(prodRef.stock - unitsSold).toFixed(2));
                stockChanged = true;
            }

            await window.saveSales();
            if (stockChanged) await window.saveProducts();
            window.updateStats();
            selectedProduct = null;
            _saleAmount = '';
            _saleQty = '';
            _ratePurchase = null;
            _rateSelling = null;
            saleFilterDate = date;
            window.toast('✅ Sale added!');
            render();
        };
        window.deleteSale = async function(id) {
            const ok = await window.confirmDialog('Delete this sale?', { danger: true });
            if (!ok) return;
            sales = sales.filter(s => String(s.id) !== String(id));
            await window.saveSales();
            window.updateStats();
            render();
            window.toast('🗑️ Sale deleted');
        };
        window.handleClearDaySales = async function(date) {
            const ok = await window.confirmDialog('Clear all sales for ' + date + '?', { danger: true });
            if (ok) window.clearDaySales(date);
        };
        window.clearDaySales = async function(date) {
            sales = sales.filter(s => s.date !== date);
            await window.saveSales();
            window.updateStats();
            render();
            window.toast('Cleared ' + date);
        };

        // ============================================================
        // PRODUCT TAB
        // ============================================================
        // Builds the profit/margin/stock preview HTML from current field values.
        window.buildProdPreview = function() {
            const purchase = parseFloat(_prodPurchase);
            const selling = parseFloat(_prodSelling);
            const lotQty = parseFloat(_prodLotQty);
            const lotTotal = parseFloat(_prodLotTotal);

            let previewRows = '';
            if (_prodMode === 'price') {
                if (!isNaN(purchase) && !isNaN(selling) && selling > 0) {
                    const margin = ((selling - purchase) / selling) * 100;
                    const profit = selling - purchase;
                    previewRows = `<div class="row-line"><span>Profit / unit</span><span style="color:${profit>=0?'var(--green)':'var(--red)'}">Rs ${window.fmt(profit)} (${margin.toFixed(1)}%)</span></div>`;
                }
            } else {
                if (!isNaN(lotQty) && lotQty > 0 && !isNaN(lotTotal) && lotTotal >= 0) {
                    const perUnit = lotTotal / lotQty;
                    previewRows = `<div class="row-line"><span>Purchase price / unit</span><span>Rs ${perUnit.toFixed(2)}</span></div>`;
                    if (!isNaN(selling) && selling > 0) {
                        const margin = ((selling - perUnit) / selling) * 100;
                        const profit = selling - perUnit;
                        previewRows += `<div class="row-line"><span>Profit / unit</span><span style="color:${profit>=0?'var(--green)':'var(--red)'}">Rs ${profit.toFixed(2)} (${margin.toFixed(1)}%)</span></div>`;
                    }
                    previewRows += `<div class="row-line"><span>Stock added</span><span>${window.fmtQty(lotQty)} units</span></div>`;
                }
            }
            return previewRows;
        };

        // Refreshes just the preview box in place — never touches the price
        // inputs themselves, so the mobile keyboard stays open while typing.
        window.updateProdPreview = function() {
            const el = document.getElementById('prodPreview');
            if (el) el.innerHTML = window.buildProdPreview();
        };

        window.renderProduct = function() {
            // -------- Editing an existing product --------
            if (_editingProductId) {
                const p = products.find(pr => pr.id === _editingProductId);
                if (!p) { _editingProductId = null; }
                else {
                    app.innerHTML = `
                        <div class="card">
                            <div class="card-title">✏️ Edit Product</div>
                            <div class="field"><label>Product Name</label><input type="text" id="editName" autocomplete="off" value="${window.escAttr(p.name)}"></div>
                            <div class="grid-3">
                                <div class="field"><label>Purchase Price/unit</label><input type="number" id="editPurchase" autocomplete="off" value="${p.purchasePrice}" step="0.01"></div>
                                <div class="field"><label>Selling Price/unit</label><input type="number" id="editSelling" autocomplete="off" value="${p.sellingPrice}" step="0.01"></div>
                                <div class="field"><label>Stock</label><input type="number" id="editStock" autocomplete="off" value="${p.stock!=null?p.stock:''}" placeholder="—" step="0.01"></div>
                            </div>
                            <button class="btn btn-primary" onclick="window.saveEditProduct()">💾 Save Changes</button>
                            <button class="btn btn-outline" onclick="_editingProductId=null;render();">Cancel</button>
                        </div>
                    `;
                    return;
                }
            }

            // -------- Viewing a product's sale history --------
            if (_viewingProductId) {
                const p = products.find(pr => pr.id === _viewingProductId);
                if (!p) { _viewingProductId = null; }
                else {
                    const history = sales.filter(s => s.productId === p.id).sort((a, b) => b.timestamp - a.timestamp);
                    const totalQty = history.reduce((a, s) => a + (s.sellingRate > 0 ? s.amount / s.sellingRate : 0), 0);
                    const totalAmt = history.reduce((a, s) => a + s.amount, 0);
                    const totalProfit = history.reduce((a, s) => a + s.profit, 0);

                    // Group by the rate it was sold at, so "180 once, 190 once, 50 once" is easy to see
                    const byRate = {};
                    history.forEach(s => {
                        const key = s.sellingRate;
                        if (!byRate[key]) byRate[key] = { count: 0, amount: 0 };
                        byRate[key].count += 1;
                        byRate[key].amount += s.amount;
                    });
                    const rateRows = Object.keys(byRate).sort((a,b)=>b-a).map(rate => `
                        <div class="row-line"><span>Rs ${window.fmt(rate)} rate</span><span>${byRate[rate].count}x · Rs ${window.fmt(byRate[rate].amount)} total</span></div>
                    `).join('');

                    // Group by the date it was sold, so it's clear at a
                    // glance which date how much of this product moved.
                    const byDate = {};
                    history.forEach(s => {
                        const key = s.date || window.tt('Unknown date', 'Tareekh maloom nahi');
                        if (!byDate[key]) byDate[key] = { count: 0, amount: 0, profit: 0 };
                        byDate[key].count += 1;
                        byDate[key].amount += s.amount;
                        byDate[key].profit += s.profit;
                    });
                    const dateRows = Object.keys(byDate).sort((a, b) => b.localeCompare(a)).map(date => `
                        <div class="list-item">
                            <div class="left"><div class="name">📅 ${window.esc(date)}</div><div class="sub">${byDate[date].count}x sold</div></div>
                            <div class="right"><span style="font-weight:700;">Rs ${window.fmt(byDate[date].amount)}</span></div>
                        </div>
                    `).join('');

                    app.innerHTML = `
                        <div class="card">
                            <div class="card-title">🧾 ${window.esc(p.name)} — Sale History</div>
                            <div class="row-line"><span>Total Sold</span><span>Rs ${window.fmt(totalAmt)}</span></div>
                            <div class="row-line"><span>Total Profit</span><span>Rs ${window.fmt(totalProfit)}</span></div>
                            <div class="row-line"><span>Total Units</span><span>${window.fmtQty(totalQty)}</span></div>
                        </div>
                        <div class="section-label">📅 ${window.tt('By Date', 'Tareekh ke Hisaab Se')}</div>
                        <div class="card scrollable">${dateRows || '<div class="empty-state">No sales yet</div>'}</div>
                        <div class="section-label">By Rate Sold</div>
                        <div class="card">${rateRows || '<div class="empty-state">No sales yet</div>'}</div>
                        <div class="section-label">Every Sale</div>
                        <div class="card scrollable">
                            ${history.length ? history.map(s => `
                                <div class="list-item">
                                    <div class="left"><div class="name">📅 ${s.date || window.tt('Unknown date', 'Tareekh maloom nahi')}</div><div class="sub">Rs ${window.fmt(s.amount)} · rate Rs ${window.fmt(s.sellingRate)}</div></div>
                                    <div class="right"><span class="${s.profit>=0?'profit-pos':'profit-neg'}">Rs ${window.fmt(s.profit)}</span></div>
                                </div>
                            `).join('') : '<div class="empty-state">No sales yet</div>'}
                        </div>
                        <button class="btn btn-outline" onclick="_viewingProductId=null;render();">Close</button>
                    `;
                    return;
                }
            }

            const modeFields = _prodMode === 'price' ? `
                <div class="grid-3">
                    <div class="field"><label>Purchase Price/unit</label><input type="number" id="prodPurchase" autocomplete="off" value="${_prodPurchase}" placeholder="0" step="0.01" oninput="window.onProdFieldInput('_prodPurchase', this.value)"></div>
                    <div class="field"><label>Selling Price/unit</label><input type="number" id="prodSelling" autocomplete="off" value="${_prodSelling}" placeholder="0" step="0.01" oninput="window.onProdFieldInput('_prodSelling', this.value)"></div>
                    <div class="field"><label>Stock (optional)</label><input type="number" id="prodStock" autocomplete="off" value="${_prodStock}" placeholder="—" step="0.01" oninput="_prodStock=this.value"></div>
                </div>
            ` : `
                <div class="grid-3">
