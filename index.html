                    <div class="field"><label>Quantity Purchased</label><input type="number" id="prodLotQty" autocomplete="off" value="${_prodLotQty}" placeholder="e.g. 50" step="0.01" oninput="window.onProdFieldInput('_prodLotQty', this.value)"></div>
                    <div class="field"><label>Total Purchase (Rs)</label><input type="number" id="prodLotTotal" autocomplete="off" value="${_prodLotTotal}" placeholder="e.g. 5000" step="0.01" oninput="window.onProdFieldInput('_prodLotTotal', this.value)"></div>
                    <div class="field"><label>Selling Price/unit</label><input type="number" id="prodSelling" autocomplete="off" value="${_prodSelling}" placeholder="0" step="0.01" oninput="window.onProdFieldInput('_prodSelling', this.value)"></div>
                </div>
            `;

            app.innerHTML = `
                <div class="card">
                    <div class="card-title">📦 Add Product</div>
                    <div class="field"><label>Product Name</label><input type="text" id="prodName" autocomplete="off" value="${window.escAttr(_prodName)}" placeholder="e.g. Milk" oninput="_prodName=this.value"></div>
                    <div class="type-toggle">
                        <button class="${_prodMode==='price'?'active-payment':''}" onclick="window.setProdMode('price')">💰 Enter Price</button>
                        <button class="${_prodMode==='lot'?'active-payment':''}" onclick="window.setProdMode('lot')">📦 Enter Quantity</button>
                    </div>
                    ${modeFields}
                    <div id="prodPreview" style="margin-top:8px;">${window.buildProdPreview()}</div>
                    <button class="btn btn-primary" onclick="window.addProduct()">➕ Add Product</button>
                </div>
                <div class="section-label">All Products (${products.length}) <span style="font-weight:400;color:var(--text-dim);font-size:11px;">${window.tt('search to edit, or tap name for history', 'search karke edit karo, ya naam tap karo history ke liye')}</span></div>
                <div class="card">
                    <input type="text" id="prodSearchInput" autocomplete="off" placeholder="🔍 ${window.tt('Search products...', 'Product search karein...')}" value="${window.escAttr(_prodSearchQuery)}" oninput="window.onProdSearchInput(this.value)">
                    <div id="prodListContainer" style="margin-top:10px;">${window.buildProdListHtml()}</div>
                </div>
            `;
        };

        // Builds just the product-list HTML, filtered by the current search query.
        window.buildProdListHtml = function() {
            const q = (_prodSearchQuery || '').trim().toLowerCase();
            const list = q ? products.filter(p => p.name.toLowerCase().includes(q)) : products;
            if (products.length === 0) return '<div class="empty-state">No products</div>';
            if (list.length === 0) return '<div class="empty-state">No product matches your search</div>';
            return list.map(p => `
                <div class="list-item">
                    <div class="left" onclick="window.viewProductHistory('${p.id}')"><div class="name">${window.esc(p.name)}</div><div class="sub">Purchase: Rs ${window.fmt(p.purchasePrice)} · Selling: Rs ${window.fmt(p.sellingPrice)}${p.stock!=null?` · Stock: <span class="${p.stock<=lowStockThreshold?'stock-low':''}">${window.fmtQty(p.stock)}</span>`:''}</div></div>
                    <div class="right">
                        ${p.stock!=null?`<button class="restock-btn" title="Restock" onclick="window.restockProduct('${p.id}')">➕📦</button>`:''}
                        <button class="edit-btn" title="Edit" onclick="window.editProduct('${p.id}')">✎</button>
                        <button class="del-btn" onclick="window.deleteProduct('${p.id}')">✕</button>
                    </div>
                </div>
            `).join('');
        };

        // Updates only the filtered list container in place — the search
        // input itself is never touched, so the mobile keyboard stays open.
        window.onProdSearchInput = function(v) {
            _prodSearchQuery = v;
            const el = document.getElementById('prodListContainer');
            if (el) el.innerHTML = window.buildProdListHtml();
        };

        window.setProdMode = function(mode) {
            _prodMode = mode;
            render();
        };

        window.onProdFieldInput = function(varName, val) {
            if (varName === '_prodPurchase') _prodPurchase = val;
            else if (varName === '_prodSelling') _prodSelling = val;
            else if (varName === '_prodLotQty') _prodLotQty = val;
            else if (varName === '_prodLotTotal') _prodLotTotal = val;
            window.updateProdPreview();
        };

        window.addProduct = async function() {
            const name = document.getElementById('prodName').value.trim();
            if (!name) { window.toast('Enter name'); return; }
            if (products.find(p => p.name.toLowerCase() === name.toLowerCase())) { window.toast('Product exists'); return; }

            let purchase, selling, stock;

            if (_prodMode === 'price') {
                purchase = parseFloat(document.getElementById('prodPurchase').value);
                selling = parseFloat(document.getElementById('prodSelling').value);
                const stockRaw = document.getElementById('prodStock').value;
                stock = stockRaw === '' ? null : parseFloat(stockRaw);
                if (isNaN(purchase) || purchase < 0) { window.toast('Valid purchase price'); return; }
                if (isNaN(selling) || selling < 0) { window.toast('Valid selling price'); return; }
                if (stockRaw !== '' && (isNaN(stock) || stock < 0)) { window.toast('Valid stock number'); return; }
            } else {
                const qty = parseFloat(document.getElementById('prodLotQty').value);
                const total = parseFloat(document.getElementById('prodLotTotal').value);
                selling = parseFloat(document.getElementById('prodSelling').value);
                if (isNaN(qty) || qty <= 0) { window.toast('Enter valid quantity'); return; }
                if (isNaN(total) || total < 0) { window.toast('Enter valid total purchase amount'); return; }
                if (isNaN(selling) || selling < 0) { window.toast('Valid selling price'); return; }
                purchase = total / qty;
                stock = qty;
            }

            products.push({ id: window.uid(), name, purchasePrice: purchase, sellingPrice: selling, stock: stock });
            await window.saveProducts();
            _prodName = '';
            _prodPurchase = '';
            _prodSelling = '';
            _prodStock = '';
            _prodLotQty = '';
            _prodLotTotal = '';
            window.toast('✅ Product added!');
            render();
        };

        window.editProduct = function(id) {
            _editingProductId = id;
            _viewingProductId = null;
            render();
        };

        window.saveEditProduct = async function() {
            const p = products.find(pr => pr.id === _editingProductId);
            if (!p) return;
            const name = document.getElementById('editName').value.trim();
            const purchase = parseFloat(document.getElementById('editPurchase').value);
            const selling = parseFloat(document.getElementById('editSelling').value);
            const stockRaw = document.getElementById('editStock').value;
            const stock = stockRaw === '' ? null : parseFloat(stockRaw);

            if (!name) { window.toast('Enter name'); return; }
            const dup = products.find(pr => pr.id !== p.id && pr.name.toLowerCase() === name.toLowerCase());
            if (dup) { window.toast('Another product already has this name'); return; }
            if (isNaN(purchase) || purchase < 0) { window.toast('Valid purchase price'); return; }
            if (isNaN(selling) || selling < 0) { window.toast('Valid selling price'); return; }
            if (stockRaw !== '' && (isNaN(stock) || stock < 0)) { window.toast('Valid stock number'); return; }

            p.name = name;
            p.purchasePrice = purchase;
            p.sellingPrice = selling;
            p.stock = stock;

            // keep past sale records showing the correct product name too
            sales.forEach(s => { if (s.productId === p.id) s.productName = name; });

            await window.saveProducts();
            await window.saveSales();
            _editingProductId = null;
            window.toast('✅ Product updated!');
            render();
        };

        window.viewProductHistory = function(id) {
            _viewingProductId = id;
            _editingProductId = null;
            render();
        };

        window.deleteProduct = async function(id) {
            const ok = await window.confirmDialog('Delete this product?', { danger: true });
            if (!ok) return;
            products = products.filter(p => String(p.id) !== String(id));
            await window.saveProducts();
            render();
            window.toast('🗑️ Product deleted');
        };

        window.restockProduct = async function(id) {
            const p = products.find(pr => pr.id === id);
            if (!p) return;
            const add = await window.promptDialog('Add how many units to stock for "' + p.name + '"?', '10');
            if (add === null) return;
            const n = parseFloat(add);
            if (isNaN(n) || n <= 0) { window.toast('Enter a valid number'); return; }
            p.stock = +((p.stock || 0) + n).toFixed(2);
            await window.saveProducts();
            window.toast('✅ Stock updated');
            render();
        };

        // ============================================================
        // EXPENSE TAB
        // ============================================================
        window.renderExpense = function() {
            const fd = expenseFilterDate || window.today();
            const fe = expenses.filter(e => e.date === fd);
            const total = fe.reduce((a, e) => a + e.amount, 0);

            app.innerHTML = `
                <div class="card">
                    <div class="card-title">💳 Add Expense</div>
                    <div class="field"><label>Description</label><input type="text" id="expDesc" autocomplete="off" value="${window.escAttr(_expDesc)}" placeholder="e.g. Electricity" oninput="_expDesc=this.value"></div>
                    <div class="field"><label>Amount (Rs)</label><input type="number" id="expAmount" autocomplete="off" value="${_expAmount}" placeholder="0" oninput="_expAmount=this.value"></div>
                    <div class="field"><label>Date</label><input type="date" id="expDate" value="${_expDate||window.today()}" oninput="_expDate=this.value"></div>
                    <button class="btn btn-danger" onclick="window.addExpense()">➕ Add Expense</button>
                </div>
                <div class="section-label">📅 ${fd} <span style="font-weight:400;color:var(--text-dim);font-size:12px;">(Total: Rs ${window.fmt(total)})</span></div>
                <div class="card">
                    <div class="filter-bar">
                        <input type="date" value="${fd}" onchange="expenseFilterDate=this.value;window.renderExpense();">
                        <button onclick="expenseFilterDate=window.today();window.renderExpense();">Today</button>
                        <button onclick="window.handleClearDayExpenses('${fd}')" style="background:var(--red);color:var(--on-accent);">Clear</button>
                    </div>
                    ${fe.length===0?'<div class="empty-state">No expenses</div>':
                    fe.map(e => `
                        <div class="list-item">
                            <div class="left"><div class="name">${window.esc(e.description)}</div><div class="sub">${e.date}</div></div>
                            <div class="right"><span style="color:var(--red);font-weight:700;">Rs ${window.fmt(e.amount)}</span><button class="del-btn" onclick="window.deleteExpense('${e.id}')">✕</button></div>
                        </div>
                    `).join('')}
                </div>
            `;
        };

        window.addExpense = async function() {
            const desc = document.getElementById('expDesc').value.trim();
            const amount = parseFloat(document.getElementById('expAmount').value);
            const date = document.getElementById('expDate').value || window.today();
            if (!desc) { window.toast('Enter description'); return; }
            if (isNaN(amount) || amount <= 0) { window.toast('Valid amount'); return; }
            expenses.push({ id: window.uid(), description: desc, amount, date, timestamp: Date.now() });
            await window.saveExpenses();
            _expDesc = '';
            _expAmount = '';
            _expDate = '';
            expenseFilterDate = date;
            window.toast('✅ Expense added!');
            render();
        };

        window.deleteExpense = async function(id) {
            const ok = await window.confirmDialog('Delete this expense?', { danger: true });
            if (!ok) return;
            expenses = expenses.filter(e => String(e.id) !== String(id));
            await window.saveExpenses();
            render();
            window.toast('🗑️ Expense deleted');
        };

        window.handleClearDayExpenses = async function(date) {
            const ok = await window.confirmDialog('Clear expenses for ' + date + '?', { danger: true });
            if (ok) window.clearDayExpenses(date);
        };

        window.clearDayExpenses = async function(date) {
            expenses = expenses.filter(e => e.date !== date);
            await window.saveExpenses();
            render();
            window.toast('Cleared ' + date);
        };

        // ============================================================
        // UDHAR TAB
        // ============================================================
        window.buildUdharCustomerListHtml = function() {
            const custMap = {};
            udhar.forEach(u => {
                if (!custMap[u.customer]) custMap[u.customer] = { credit: 0, payment: 0 };
                if (u.type === 'credit') custMap[u.customer].credit += u.amount;
                else custMap[u.customer].payment += u.amount;
            });
            const q = (_udharCustomerSearch || '').trim().toLowerCase();
            const allNames = Object.keys(custMap).sort();
            const filteredNames = q ? allNames.filter(n => n.toLowerCase().includes(q)) : allNames;
            if (!filteredNames.length) return `<div class="empty-state">${q ? window.tt('No customer found', 'Koi customer nahi mila') : window.tt('No customers yet', 'Abhi koi customer nahi')}</div>`;
            return filteredNames.map(name => {
                const c = custMap[name];
                const bal = c.credit - c.payment;
                return `
                    <div class="customer-row" style="cursor:default;">
                        <span class="cname" style="cursor:pointer;flex:1;" onclick="window.openUdharCustomer('${window.escAttr(name)}')">${window.esc(name)}</span>
                        <span class="cbal" style="color:${bal>=0?'var(--red)':'var(--green)'};margin-right:8px;cursor:pointer;" onclick="window.openUdharCustomer('${window.escAttr(name)}')">${bal>=0?'+':''}Rs ${window.fmt(Math.abs(bal))}</span>
                        ${bal > 0 ? `<button class="restock-btn" title="Receive Payment" onclick="event.stopPropagation();window.quickReceivePayment('${window.escAttr(name)}')">💰</button>` : ''}
                    </div>
                `;
            }).join('');
        };

        // Updates only the filtered customer list container — the search
        // input itself is never touched, so the mobile keyboard stays open.
        window.onUdharCustomerSearch = function(v) {
            _udharCustomerSearch = v;
            const el = document.getElementById('udharCustomerListContainer');
            if (el) el.innerHTML = window.buildUdharCustomerListHtml();
        };

        // Lets you record a payment for a customer directly from the list,
        // without opening their full item-entry page — handy for quick
        // credit recovery.
        window.quickReceivePayment = async function(name) {
            const amt = await window.promptDialog('Kitni raqam mil gayi "' + name + '" se?', '');
            if (amt === null) return;
            const amount = parseFloat(amt);
            if (isNaN(amount) || amount <= 0) { window.toast(window.tt('Please enter a valid amount', 'Sahi amount likhein')); return; }
            udhar.push({ id: window.uid(), customer: name, product: 'General', amount, type: 'payment', note: '',
                cost: 0, profit: 0, date: window.today(), timestamp: Date.now(), billId: null });
            await window.saveUdhar();
            window.updateStats();
            window.toast(window.tt('✅ Payment recorded!', '✅ Payment record hogayi!'));
            render();
        };

        window.renderUdhar = function() {
            // If a customer's item-entry page is open, show that instead.
            if (_udharActiveCustomer) { window.renderUdharActive(); return; }

            const custMap = {};
            udhar.forEach(u => {
                if (!custMap[u.customer]) custMap[u.customer] = { credit: 0, payment: 0 };
                if (u.type === 'credit') custMap[u.customer].credit += u.amount;
                else custMap[u.customer].payment += u.amount;
            });
            const net = Object.values(custMap).reduce((a, c) => a + (c.credit - c.payment), 0);
            const totalUdharProfit = udhar.filter(u => u.type === 'credit').reduce((a, u) => a + (u.profit || 0), 0);

            app.innerHTML = `
                <div class="summary-grid">
                    <div class="stat-card red"><div class="label">${window.tt('Total Outstanding', 'Kul Baqaya')}</div><div class="value">Rs ${window.fmt(net)}</div></div>
                    <div class="stat-card green"><div class="label">${window.tt('Total Credit Profit', 'Kul Udhar Profit')}</div><div class="value">Rs ${window.fmt(totalUdharProfit)}</div></div>
                </div>
                <div class="card">
                    <div class="card-title">🤝 ${window.tt('Start New Credit', 'Naya Udhar Shuru Karein')}</div>
                    <div class="field"><label>${window.tt('Customer Name', 'Customer ka Naam')}</label><input type="text" id="udharStartName" autocomplete="off" value="${window.escAttr(_udharStartName)}" placeholder="${window.tt('Enter customer name', 'Customer name likhein')}" oninput="_udharStartName=this.value" list="custList"><datalist id="custList">${Object.keys(custMap).map(c => `<option value="${window.escAttr(c)}">`).join('')}</datalist></div>
                    <div class="field"><label>${window.tt('Reason (optional)', 'Kaam / Wajah (optional)')}</label><input type="text" id="udharStartNote" autocomplete="off" value="${window.escAttr(_udharStartNote)}" placeholder="${window.tt('e.g. Groceries on credit', 'e.g. Ration udhar')}" oninput="_udharStartNote=this.value"></div>
                    <button class="btn btn-danger" onclick="window.startUdharCustomer()">➕ ${window.tt('Save and Add Items', 'Save aur Items Add Karein')}</button>
                </div>
                <div class="section-label">${window.tt('Customers', 'Customers')} <span style="font-weight:400;color:var(--text-dim);font-size:12px;">(Net: Rs ${window.fmt(net)})</span></div>
                <div class="card">
                    <input type="text" id="udharCustomerSearch" autocomplete="off" placeholder="🔍 ${window.tt('Search customer by name...', 'Search customer by name...')}" value="${window.escAttr(_udharCustomerSearch)}" oninput="window.onUdharCustomerSearch(this.value)" style="margin-bottom:10px;">
                    <div class="scrollable" id="udharCustomerListContainer">${window.buildUdharCustomerListHtml()}</div>
                </div>
            `;
        };

        // Opens (or creates) the dedicated item-entry page for a customer.
        window.startUdharCustomer = function() {
            const nameBox = document.getElementById('udharStartName');
            const name = nameBox.value.trim();
            if (!name) { window.toast(window.tt('Please enter a customer name', 'Customer ka naam likhein')); return; }
            _udharActiveCustomer = name;
            _udharPendingStartNote = document.getElementById('udharStartNote').value.trim();
            _udharStartName = '';
            _udharStartNote = '';
            _udharProduct = '';
            _udharAmount = '';
            _udharProfit = '';
            _udharNote = _udharPendingStartNote || '';
            udharType = 'credit';
            render();
        };

        window.openUdharCustomer = function(name) {
            _udharActiveCustomer = name;
            _udharProduct = '';
            _udharAmount = '';
            _udharProfit = '';
            _udharNote = '';
            udharType = 'credit';
            render();
        };

        // The dedicated "alag page" — keep entering product + price and each
        // one is added to the system immediately, without retyping the customer.
        window.renderUdharActive = function() {
            const name = _udharActiveCustomer;
            const entries = udhar.filter(u => u.customer === name).sort((a, b) => b.timestamp - a.timestamp);
            const credit = entries.filter(u => u.type === 'credit').reduce((a, u) => a + u.amount, 0);
            const payment = entries.filter(u => u.type === 'payment').reduce((a, u) => a + u.amount, 0);
            const bal = credit - payment;

            app.innerHTML = `
                <div class="card">
                    <div class="card-title">🧾 ${window.esc(name)} <span style="font-size:12px;font-weight:400;color:${bal>=0?'var(--red)':'var(--green)'}">(Balance: Rs ${window.fmt(Math.abs(bal))} ${bal>=0?window.tt('due','due'):window.tt('overpaid','over')})</span></div>
                    <div class="type-toggle">
                        <button class="${udharType==='credit'?'active-credit':''}" onclick="udharType='credit';window.renderUdharActive();">🔴 ${window.tt('Credit Item', 'Udhar Item')}</button>
                        <button class="${udharType==='payment'?'active-payment':''}" onclick="udharType='payment';window.renderUdharActive();">🟢 ${window.tt('Payment Received', 'Payment Mila')}</button>
                    </div>
                    ${udharType === 'credit' ? `
                    <div class="field"><label>${window.tt('Product', 'Product')}</label>
                        <div class="search-wrap">
                            <input type="text" id="udharProductSearch" autocomplete="off" placeholder="${window.tt('Search product or type a new name', 'Product search karein ya naya naam likhein')}"
                                value="${window.escAttr(_udharProduct)}"
                                oninput="window.onUdharProductInput(this.value)"
                                onfocus="window.onUdharProductFocus()"
                                onblur="window.onUdharProductBlur()">
                            <div class="search-dropdown" id="udharProductDropdown" style="display:${_udharDropdownOpen ? 'block' : 'none'}"></div>
                        </div>
                    </div>
                    <div class="field"><label>${window.tt('Price / Amount (Rs)', 'Price / Amount (Rs)')}</label><input class="amount-input" type="number" id="udharAmount" autocomplete="off" placeholder="0" value="${_udharAmount}" oninput="_udharAmount=this.value;window.suggestUdharProfit();"></div>
                    <div class="field"><label>${window.tt('Profit (Rs) — fills in automatically when you pick a product, or edit it yourself', 'Profit (Rs) — product select karne par auto aa jayega, chahein to khud badal lein')}</label><input type="number" id="udharProfit" autocomplete="off" placeholder="0" value="${_udharProfit}" oninput="_udharProfit=this.value"></div>
                    <div class="field"><label>${window.tt('Note (optional)', 'Note (optional)')}</label><input type="text" id="udharNote" autocomplete="off" value="${window.escAttr(_udharNote)}" placeholder="${window.tt('Optional', 'Optional')}" oninput="_udharNote=this.value"></div>
                    <button class="btn btn-danger" onclick="window.addUdharItem()">➕ ${window.tt('Add Item', 'Item Add Karein')}</button>
                    ` : `
                    <div class="field"><label>${window.tt('Amount Received (Rs)', 'Amount Received (Rs)')}</label><input class="amount-input" type="number" id="udharAmount" autocomplete="off" placeholder="0" value="${_udharAmount}" oninput="_udharAmount=this.value"></div>
                    <div class="field"><label>${window.tt('Note (optional)', 'Note (optional)')}</label><input type="text" id="udharNote" autocomplete="off" value="${window.escAttr(_udharNote)}" placeholder="${window.tt('Optional', 'Optional')}" oninput="_udharNote=this.value"></div>
                    ${bal > 0 ? `<button class="btn btn-outline" onclick="window.receiveFullBalance()">💰 ${window.tt('Receive Full Balance', 'Poora Balance Receive Karein')} (Rs ${window.fmt(bal)})</button>` : ''}
                    <button class="btn btn-success" onclick="window.addUdharItem()">✅ ${window.tt('Add Payment', 'Payment Add Karein')}</button>
                    `}
                </div>
                <div class="section-label">${window.tt('Items Added So Far', 'Ab Tak Add Hue Items')} (${entries.length})</div>
                ${(() => {
                    const latestCredit = entries.find(e => e.type === 'credit');
                    return latestCredit ? `<button class="btn btn-primary" onclick="window.generateBill('${latestCredit.id}')">🧾 ${window.tt('Print/Share Full Bill (All Items)', 'Poora Bill Print/Share Karein (Sab Items)')}</button>` : '';
                })()}
                <div class="card scrollable">
                    ${entries.length ? entries.map(e => `

                            <div class="right"><span style="font-weight:700;color:${e.type==='credit'?'var(--red)':'var(--green)'}">Rs ${window.fmt(e.amount)}</span><button class="bill-btn" onclick="window.generateBill('${e.id}')">🧾</button><button class="del-btn" onclick="window.deleteUdhar('${e.id}')">✕</button></div>

            const amtBox = document.getElementById('udharAmount');

                setTimeout(() => { amtBox.focus(); amtBox.select(); }, 100);

        // ------------------------------------------------------------
        // Udhar product search (same searchable pattern as the Sale tab)
        // instead of a plain <select>, since a shop can easily have
        // 200-300+ products and a native dropdown becomes unusable.

        window.onUdharProductInput = function(v) {
            _udharProduct = v;
            _udharDropdownOpen = true;
            window.updateUdharProductDropdown();

        window.onUdharProductFocus = function() {
            _udharDropdownOpen = true;
            window.updateUdharProductDropdown();

        window.onUdharProductBlur = function() {
            setTimeout(() => { _udharDropdownOpen = false; window.updateUdharProductDropdown(); }, 180);

        window.updateUdharProductDropdown = function() {
            const container = document.getElementById('udharProductDropdown');
            if (!container) return;
            container.style.display = _udharDropdownOpen ? 'block' : 'none';
            if (!_udharDropdownOpen) { container.innerHTML = ''; return; }
            const q = (_udharProduct || '').trim().toLowerCase();
            const filtered = q ? products.filter(p => p.name.toLowerCase().includes(q)) : products;
            container.innerHTML = products.length === 0 ? '<div class="empty-state">' + window.tt('Add items from the Product tab first', 'Pehle Product tab se items add karein') + '</div>' :
                filtered.length === 0 ? '<div class="empty-state">' + window.tt('No match — this will be saved as a new/general item', 'Match nahi mila — yehi naam save ho jayega (naya/general item)') + '</div>' :
                filtered.slice(0, 60).map(p => `
                    <div class="result-item" onmousedown="event.preventDefault();window.selectUdharProduct('${p.id}')">
                        <span>${window.esc(p.name)}${p.stock!=null?`<span class="stock-tag ${p.stock<=lowStockThreshold?'stock-low':''}">${window.fmtQty(p.stock)} in stock</span>`:''}</span>
                        <span class="price">Rs ${window.fmt(p.sellingPrice)}</span>
                    </div>
                `).join('');
        };
        window.selectUdharProduct = function(id) {
            const p = products.find(pr => pr.id === id);
            if (!p) return;
            _udharProduct = p.name;
            _udharDropdownOpen = false;
            const box = document.getElementById('udharProductSearch');
            if (box) box.value = p.name;
            window.updateUdharProductDropdown();
            window.suggestUdharProfit();
        };

        // One-tap way to settle a customer's whole outstanding balance,
        // instead of having to look up and type the exact amount.
        window.receiveFullBalance = function() {
            const entries = udhar.filter(u => u.customer === _udharActiveCustomer);
            const credit = entries.filter(u => u.type === 'credit').reduce((a, u) => a + u.amount, 0);
            const payment = entries.filter(u => u.type === 'payment').reduce((a, u) => a + u.amount, 0);
            const bal = credit - payment;
            if (bal <= 0) return;
            _udharAmount = String(bal);
            const amtBox = document.getElementById('udharAmount');
            if (amtBox) amtBox.value = _udharAmount;
        };

        // Auto-fills the Profit field from the matched product's margin whenever
        // the product or amount changes, but only if the person hasn't already
        // typed their own profit value for this entry.
        window.suggestUdharProfit = function() {
            if (udharType !== 'credit') return;
            const amountField = document.getElementById('udharAmount');
            const profitField = document.getElementById('udharProfit');
            if (!amountField || !profitField) return;
            const product = (_udharProduct || '').trim();
            const amount = parseFloat(amountField.value);
            const matched = products.find(pr => pr.name === product);
            if (matched && matched.sellingPrice > 0 && !isNaN(amount) && amount > 0) {
                const cost = amount * (matched.purchasePrice / matched.sellingPrice);
                const suggested = +(amount - cost).toFixed(2);
                _udharProfit = String(suggested);
                profitField.value = _udharProfit;
            }
        };

        window.addUdharItem = async function() {
            const product = (_udharProduct || '').trim();
            const amount = parseFloat(document.getElementById('udharAmount').value);
            const note = document.getElementById('udharNote').value.trim();
            if (isNaN(amount) || amount <= 0) { window.toast(window.tt('Please enter a valid amount', 'Sahi amount likhein')); return; }

            let cost = 0, profit = 0, matchedProduct = null;
            if (udharType === 'credit' && product) {
                matchedProduct = products.find(pr => pr.name === product);
                if (matchedProduct && matchedProduct.sellingPrice > 0) {
                    cost = amount * (matchedProduct.purchasePrice / matchedProduct.sellingPrice);
                    profit = amount - cost;
                }
                // Manually entered/edited Profit field always wins, since the
                // shopkeeper may sell a custom/general item that has no exact
                // match in inventory — that's why profit could go uncounted before.
                const profitFieldEl = document.getElementById('udharProfit');
                if (profitFieldEl && profitFieldEl.value !== '') {
                    const manualProfit = parseFloat(profitFieldEl.value);
                    if (!isNaN(manualProfit)) {
                        profit = manualProfit;
                        cost = amount - profit;
                    }
                }
            }

            const entryDate = window.today();
            // Bill grouping key = customer + date, so every product added for
            // this customer on this day always lands on the same bill, no
            // matter how many times the page was closed and reopened.
            const dailyBillId = 'bill_' + String(_udharActiveCustomer).trim().toLowerCase().replace(/[^a-z0-9]+/g, '_') + '_' + entryDate;
            udhar.push({ id: window.uid(), customer: _udharActiveCustomer, product: product || 'General', amount, type: udharType, note: note || '',
                cost: cost, profit: profit, date: entryDate, timestamp: Date.now(),
                billId: udharType === 'credit' ? dailyBillId : null });

            let stockChanged = false;
            if (udharType === 'credit' && matchedProduct && matchedProduct.stock != null && matchedProduct.sellingPrice > 0) {
                const unitsSold = amount / matchedProduct.sellingPrice;
                matchedProduct.stock = Math.max(0, +(matchedProduct.stock - unitsSold).toFixed(2));
                stockChanged = true;
            }

            await window.saveUdhar();
            if (stockChanged) await window.saveProducts();
            _udharAmount = '';
            _udharProduct = '';
            _udharNote = '';
            _udharProfit = '';
            _focusUdharAmount = true;
            window.updateStats();
            window.toast(udharType === 'credit' ? window.tt('✅ Item added!', '✅ Item add hogaya!') : window.tt('✅ Payment added!', '✅ Payment add hogayi!'));
            render();
        };

        window.deleteUdhar = async function(id) {
            const ok = await window.confirmDialog('Delete this entry?', { danger: true });
            if (!ok) return;
            udhar = udhar.filter(u => String(u.id) !== String(id));
            await window.saveUdhar();
            window.updateStats();
            render();
            window.toast('🗑️ Entry deleted');
        };

        // ============================================================
        // BILL
        // ============================================================
        window.generateBill = function(id) {
            const entry = udhar.find(u => u.id === id);
            if (!entry) { window.toast('Not found'); return; }
            let items = [entry];
            if (entry.type === 'credit' && entry.billId) {
                items = udhar.filter(u => u.type === 'credit' && u.billId === entry.billId && u.customer === entry.customer);
                items.sort((a, b) => a.timestamp - b.timestamp);
            }
            const total = items.reduce((a, u) => a + u.amount, 0);

            // Running balance: everything for this customer that happened
            // strictly before this bill's items, so the bill can show
            // "Previous Balance" and "Balance Due" like a real invoice.
            const earliestTs = Math.min(...items.map(it => it.timestamp || 0));
            const custEntries = udhar.filter(u => u.customer === entry.customer);
            const before = custEntries.filter(u => (u.timestamp || 0) < earliestTs);
            const balanceBefore = before.reduce((a, u) => a + (u.type === 'credit' ? u.amount : -u.amount), 0);
            const balanceAfter = entry.type === 'credit' ? balanceBefore + total : balanceBefore - total;

            const billNo = (entry.billId || entry.id).slice(-8).toUpperCase();
            const now = new Date();

            const itemTableRows = items.map(it => {
                const p = products.find(pr => pr.name === it.product);
                let qtyCell = '1', rateCell = 'Rs ' + window.fmt(it.amount);
                if (p && p.sellingPrice > 0) {
                    const qty = it.amount / p.sellingPrice;
                    qtyCell = window.fmtQty(qty);
                    rateCell = 'Rs ' + window.fmt(p.sellingPrice);
                }
                return `
                    <tr>
                        <td>${window.esc(it.product || 'General')}${it.note ? `<div class="bill-item-note">${window.esc(it.note)}</div>` : ''}</td>
                        <td class="num">${qtyCell}</td>
                        <td class="num">${rateCell}</td>
                        <td class="num">Rs ${window.fmt(it.amount)}</td>
                    </tr>
                `;
            }).join('');

            const isCredit = entry.type === 'credit';
            const modal = document.getElementById('billModal');
            modal.style.display = 'flex';
            modal.innerHTML = `
                <div class="bill-modal" onclick="if(event.target===this)window.closeBill()">
                    <div class="bill-content">
                        <div class="bill-header">
                            <h2>${window.esc(shopName || 'My Shop')}</h2>
                            <p class="bill-doc-type">${isCredit ? window.tt('CREDIT INVOICE', 'CREDIT INVOICE') : window.tt('PAYMENT RECEIPT', 'PAYMENT RECEIPT')}</p>
                            <p>${window.tt('Bill No', 'Bill No')} #${billNo} · ${entry.date}</p>
                        </div>
                        <div class="bill-row"><span>${window.tt('Customer', 'Customer')}</span><span><strong>${window.esc(entry.customer)}</strong></span></div>
                        ${isCredit ? `
                            <table class="bill-table">
                                <thead><tr><th>${window.tt('Item', 'Item')}</th><th class="num">${window.tt('Qty', 'Qty')}</th><th class="num">${window.tt('Rate', 'Rate')}</th><th class="num">${window.tt('Amount', 'Amount')}</th></tr></thead>
                                <tbody>${itemTableRows}</tbody>
                            </table>
                            <div class="bill-row total"><span>${window.tt('Bill Total', 'Bill Total')}</span><span>Rs ${window.fmt(total)}</span></div>
                        ` : `
                            <div class="bill-row"><span>${window.tt('Amount Received', 'Amount Received')}</span><span><strong>Rs ${window.fmt(total)}</strong></span></div>
                            ${entry.note ? `<div class="bill-row"><span>${window.tt('Note', 'Note')}</span><span>${window.esc(entry.note)}</span></div>` : ''}
                        `}
                        <div class="bill-balance-box">
                            <div class="bill-row"><span>${window.tt('Previous Balance', 'Pichla Balance')}</span><span>Rs ${window.fmt(Math.abs(balanceBefore))} ${balanceBefore < 0 ? window.tt('(advance)', '(advance)') : ''}</span></div>
                            <div class="bill-row total"><span>${window.tt('Balance Due', 'Baqaya Rakam')}</span><span style="color:${balanceAfter>0?'var(--red)':'var(--green)'}">Rs ${window.fmt(Math.abs(balanceAfter))} ${balanceAfter <= 0 ? window.tt('(clear)', '(clear)') : ''}</span></div>
                        </div>
                        <p class="bill-thanks">${window.tt('Thank you for your business!', 'Aapke business ka shukriya!')}</p>
                        <div style="text-align:center;font-size:10px;color:var(--text-dim);margin-top:4px;">${now.toLocaleString()}</div>
                        <div class="bill-actions">
                            <button class="btn btn-primary" onclick="window.print()">🖨️ Print</button>
                            <button class="btn btn-success" onclick="window.shareBillText('${entry.id}')">📤 Share</button>
                            <button class="btn btn-outline" onclick="window.closeBill()">Close</button>
                        </div>
                    </div>
                </div>
            `;
        };

        window.shareBillText = async function(id) {
            const entry = udhar.find(u => u.id === id);
            if (!entry) return;
            let items = [entry];
            if (entry.type === 'credit' && entry.billId) {
                items = udhar.filter(u => u.type === 'credit' && u.billId === entry.billId && u.customer === entry.customer);
                items.sort((a, b) => a.timestamp - b.timestamp);
            }
            const total = items.reduce((a, u) => a + u.amount, 0);
            const earliestTs = Math.min(...items.map(it => it.timestamp || 0));
            const custEntries = udhar.filter(u => u.customer === entry.customer);
            const before = custEntries.filter(u => (u.timestamp || 0) < earliestTs);
            const balanceBefore = before.reduce((a, u) => a + (u.type === 'credit' ? u.amount : -u.amount), 0);
            const balanceAfter = entry.type === 'credit' ? balanceBefore + total : balanceBefore - total;
            const billNo = (entry.billId || entry.id).slice(-8).toUpperCase();
            const itemLines = items.length > 1
                ? items.map(it => `${it.product || 'N/A'}${it.note ? (' (' + it.note + ')') : ''}: Rs ${window.fmt(it.amount)}`).join('\n')
                : `Product: ${entry.product || 'N/A'}\n${entry.note ? ('Note: ' + entry.note + '\n') : ''}`;
            const text = `🧾 ${shopName || 'My Shop'}\n${entry.type==='credit'?'CREDIT INVOICE':'PAYMENT RECEIPT'} #${billNo}\n${entry.date}\nCustomer: ${entry.customer}\n${itemLines}\nTotal: Rs ${window.fmt(total)}\nBalance Due: Rs ${window.fmt(Math.abs(balanceAfter))}${balanceAfter<=0?' (clear)':''}\nThank you for your business!`;
            try {
                if (navigator.share) {
                    await navigator.share({ text });
                    return;
                }
            } catch (e) { /* fall through to clipboard */ }
            try {
                await navigator.clipboard.writeText(text);
                window.toast('✅ Copied - paste in WhatsApp');
            } catch (e) {
                window.toast('⚠️ Could not share');
            }
        };

        window.closeBill = function() {
            document.getElementById('billModal').style.display = 'none';

        // ============================================================
        // REPORT TAB
        // ============================================================
        window.renderReport = function() {
            const start = reportStart || (sales.length ? sales.reduce((a, s) => a < s.date ? a : s.date, window.today()) :
            window.today());
            const end = reportEnd || window.today();

            const fs = sales.filter(s => s.date >= start && s.date <= end);
            const fe = expenses.filter(e => e.date >= start && e.date <= end);
            const fu = udhar.filter(u => u.type === 'credit' && u.date >= start && u.date <= end);

            // Cash-sale figures and credit (udhar) figures are kept apart —
            // credit profit belongs to the Credit tab, not mixed into the
            // shop's general profit/net-earning numbers.
            const cashSales = fs.reduce((a, s) => a + s.amount, 0);
            const cashProfit = fs.reduce((a, s) => a + s.profit, 0);
            const creditSales = fu.reduce((a, u) => a + u.amount, 0);
            const creditProfit = fu.reduce((a, u) => a + (u.profit || 0), 0);
            const totalSales = cashSales + creditSales;
            const totalProfit = cashProfit;
            const totalExp = fe.reduce((a, e) => a + e.amount, 0);
            const net = totalProfit - totalExp;

            const daily = {};
            fs.forEach(s => {
                if (!daily[s.date]) daily[s.date] = { sales: 0, profit: 0, count: 0, creditSales: 0, creditProfit: 0 };
                daily[s.date].sales += s.amount;
                daily[s.date].profit += s.profit;
                daily[s.date].count += 1;
            });
            fu.forEach(u => {
                if (!daily[u.date]) daily[u.date] = { sales: 0, profit: 0, count: 0, creditSales: 0, creditProfit: 0 };
                daily[u.date].creditSales += u.amount;
                daily[u.date].creditProfit += (u.profit || 0);
            });
            fe.forEach(e => {
                if (!daily[e.date]) daily[e.date] = { sales: 0, profit: 0, exp: 0, count: 0, creditSales: 0, creditProfit: 0 };
                if (!daily[e.date].exp) daily[e.date].exp = 0;
                daily[e.date].exp += e.amount;
            });

            const dailyHtml = Object.keys(daily).sort().map(date => {
                const d = daily[date];
                const n = (d.profit || 0) - (d.exp || 0);
                return `
                    <div class="list-item">
                        <div class="left"><div class="name">${date}</div><div class="sub">${d.count||0} sales · Profit: Rs ${window.fmt(d.profit||0)}${d.creditSales?` · ${window.tt('Credit', 'Udhar')}: Rs ${window.fmt(d.creditSales)}`:''}</div></div>
                        <div class="right"><span style="font-weight:700;color:${n>=0?'var(--green)':'var(--red)'}">${n>=0?'+':''}Rs ${window.fmt(n)}</span></div>
                    </div>
                `;
            }).join('');

            const byProduct = {};
            fs.forEach(s => {
                if (!byProduct[s.productName]) byProduct[s.productName] = { amount: 0, profit: 0, count: 0, rates: {} };
                byProduct[s.productName].amount += s.amount;
                byProduct[s.productName].profit += s.profit;
                byProduct[s.productName].count += 1;
                const rk = s.sellingRate;
                byProduct[s.productName].rates[rk] = (byProduct[s.productName].rates[rk] || 0) + 1;
            });
            const topProducts = Object.entries(byProduct)
                .sort((a, b) => b[1].amount - a[1].amount)
                .slice(0, 5);

            const topHtml = topProducts.length ? topProducts.map(([name, d], i) => {
                const rateBreakdown = Object.keys(d.rates).sort((a,b)=>b-a).map(r => `Rs ${window.fmt(r)} ×${d.rates[r]}`).join(', ');
                return `
                <div class="list-item">
                    <div class="left"><div class="name"><span class="rank-badge">${i+1}</span>${window.esc(name)}</div><div class="sub">${d.count} sales · Profit: Rs ${window.fmt(d.profit)}</div><div class="sub">Rates: ${rateBreakdown}</div></div>
                    <div class="right"><span style="font-weight:700;color:var(--gold);">Rs ${window.fmt(d.amount)}</span></div>
                </div>
            `;}).join('') : '<div class="empty-state">No sales in this range</div>';

            app.innerHTML = `
                <div class="card">
                    <div class="card-title">📈 Report</div>
                    <div class="date-range">
                        <input type="date" value="${start}" onchange="reportStart=this.value;window.renderReport();">
                        <span style="color:var(--text-dim);">to</span>
                        <input type="date" value="${end}" onchange="reportEnd=this.value;window.renderReport();">
                        <button onclick="reportStart='';reportEnd='';window.renderReport();">All</button>
                    </div>
                    <div class="summary-grid">
                        <div class="stat-card gold"><div class="label">Cash Sales</div><div class="value">Rs ${window.fmt(cashSales)}</div></div>
                        <div class="stat-card green"><div class="label">Cash Profit</div><div class="value">Rs ${window.fmt(cashProfit)}</div></div>
                        <div class="stat-card red"><div class="label">Total Expenses</div><div class="value">Rs ${window.fmt(totalExp)}</div></div>
                        <div class="stat-card ${net>=0?'green':'red'}"><div class="label">Net Earning</div><div class="value">${net>=0?'+':''}Rs ${window.fmt(net)}</div></div>
                    </div>
                    <p style="font-size:10.5px;color:var(--text-dim);margin-top:8px;">${window.tt('Net Earning is cash-sale profit minus expenses. Credit (udhar) profit is tracked separately in the Credit tab and is not mixed in here.', 'Net Earning sirf cash-sale profit minus expenses hai. Udhar ka profit alag se Credit tab mein hi rehta hai, yahan shamil nahi hota.')}</p>
                </div>
                <div class="section-label">🤝 ${window.tt('Credit (Udhar) — kept separate', 'Udhar — alag rakha gaya hai')}</div>
                <div class="card">
                    <div class="row-line"><span>${window.tt('Credit Sales', 'Udhar Sales')}</span><span>Rs ${window.fmt(creditSales)}</span></div>
                    <div class="row-line"><span>${window.tt('Credit Profit', 'Udhar Profit')}</span><span style="color:var(--green);font-weight:700;">Rs ${window.fmt(creditProfit)}</span></div>
                </div>
                <div class="section-label">🏆 Top Selling Products <span style="font-weight:400;color:var(--text-dim);font-size:11px;">(cash sales, with rate breakdown)</span></div>
                <div class="card">${topHtml}</div>
                <div class="section-label">📅 Daily Summary</div>
                <div class="card">${dailyHtml||'<div class="empty-state">No data</div>'}</div>
            `;
        };

                    <div class="field">
                        <label>Sync Code (dono phones par bilkul same likhein — e.g. apni shop ka naam)</label>
                        <input type="text" id="syncCodeInput" autocomplete="off" value="${window.escAttr(syncCode)}" placeholder="e.g. karim-general-store" oninput="window.onSyncCodeInput(this.value)" ${window.cloudSyncEnabled ? 'disabled' : ''}>
                    </div>
                    ${window.cloudSyncEnabled ? `
                        <button class="btn btn-outline" onclick="window.pushToCloud()">🔁 Sync Now</button>
                        <button class="btn btn-danger" onclick="window.disconnectCloudSync()">Disconnect</button>
                    ` : `
                        <button class="btn btn-primary" onclick="window.connectCloudSync()">🔗 Connect</button>
                    `}
                </div>
                <div class="card">
                    <div class="card-title">⚙️ ${window.t('settingsTitle')}</div>
                    <div class="field"><label>${window.t('shopNameLabel')}</label><input type="text" id="settingsShopName" value="${window.escAttr(shopName)}" onchange="window.onShopNameInput(this.value)"></div>
                    <div class="field"><label>${window.t('lowStockLabel')} ${window.tt('(shows a warning when stock is at or below this)', '(kam ho to warning dikhayein)')}</label><input type="number" id="settingsLowStock" value="${lowStockThreshold}" min="0" step="1" onchange="window.onLowStockChange(this.value)"></div>
                    <button class="btn btn-primary" onclick="window.exportData()">${window.t('exportBtn')}</button>
                    <button class="btn btn-outline" onclick="document.getElementById('importFile').click();">${window.t('importBtn')}</button>
                    <input type="file" id="importFile" accept=".json" style="display:none" onchange="window.importData(event)">
                    <button class="btn btn-danger" onclick="window.handleClearAll()">${window.t('deleteAllBtn')}</button>
                    <div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border);font-size:11px;color:var(--text-dim);">
                        <p>Products: ${products.length}</p>
                        <p>Sales: ${sales.length}</p>
                        <p>Expenses: ${expenses.length}</p>
                        <p>Credit Entries: ${udhar.length}</p>
                        <p style="margin-top:6px;">${lastBackupAt ? `${window.tt('Last backup', 'Last backup')}: ${lastBackupDays === 0 ? window.tt('Today', 'Today') : window.tt(`${lastBackupDays} days ago`, lastBackupDays + ' din pehle')}` : window.tt('Data is saved automatically and stays available next time you open this app.', 'Data is saved automatically and stays available next time you open this app.')}</p>
                        <p style="margin-top:6px;">💡 ${window.tt('Tip: Export your data weekly so it stays safe if your phone breaks or the app is deleted.', 'Tip: Export data se hafta-vaar backup banate rahein, taake phone kharab ho ya app delete ho jaye to data safe rahe.')}</p>
                    </div>
                </div>
                <div class="card">
                    <div class="card-title">ℹ️ ${window.tt('About', 'About')}</div>
                    <div style="text-align:center;padding:6px 0 12px;">
                        <div style="font-size:28px;">🏪</div>
                        <div style="font-weight:700;font-size:15px;margin-top:4px;">Shop Ledger</div>
                        <div style="font-size:11px;color:var(--text-dim);">Version 1.0</div>
                    </div>
                    <p style="font-size:12px;color:var(--text-dim);line-height:1.6;">
                        ${window.tt('A simple, offline-first ledger for tracking sales, stock, expenses, and customer credit — built to run entirely on your device with no account or internet required.', 'Ek simple, offline ledger jo sales, stock, expenses, aur customer credit track karta hai — bina internet ya account ke, seedha aapke device par chalti hai.')}
                    </p>
                    <div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border);font-size:11px;color:var(--text-dim);line-height:1.8;">
                        <p>✔ ${window.tt('All data stays on this device', 'Sara data isi device par rehta hai')}</p>
                        <p>✔ ${window.tt('No ads, no tracking, no account needed', 'Koi ads nahi, koi tracking nahi, koi account nahi chahiye')}</p>
                        <p>✔ ${window.tt('Works fully offline', 'Poori tarah offline chalti hai')}</p>
                        <p>✔ ${window.tt('Use Export/Import to move data between devices', 'Devices ke beech data le jaane ke liye Export/Import use karein')}</p>
                    </div>
                </div>
            `;
        };

        window.onLowStockChange = async function(val) {
            const n = parseFloat(val);
            if (isNaN(n) || n < 0) { window.toast(window.tt('Please enter a valid number', 'Sahi number likhein')); render(); return; }
            lowStockThreshold = n;
            await window.saveLowStockThreshold();
            window.toast('✅ Low stock alert updated');
        };

        window.exportData = async function() {
            try {
                const data = { products, sales, expenses, udhar, shopName, exportedAt: new Date().toISOString() };
                const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `shop_ledger_${window.today()}.json`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                lastBackupAt = new Date().toISOString();
                await window.saveLastBackup();
                window.toast('✅ Exported!');
                if (currentTab === 'settings') render();
            } catch (e) { window.toast('❌ Export failed'); }
        };

        window.importData = function(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = async function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    if (data.products) products = data.products;
                    if (data.sales) sales = data.sales;
                    if (data.expenses) expenses = data.expenses;
                    if (data.udhar) udhar = data.udhar;
                    if (data.shopName) shopName = data.shopName;
                    await window.saveAll();
                    document.getElementById('shopNameInput').value = shopName;
                    window.updateStats();
                    window.toast('✅ Imported!');
                    render();
                } catch (err) { window.toast('❌ Invalid file'); }
            };
            reader.readAsText(file);
            event.target.value = '';
        };

        window.handleClearAll = async function() {
            const ok = await window.confirmDialog('Delete ALL data? Products, sales, expenses aur credit — sab mit jayega. Yeh wapas nahi ho sakta.', { danger: true, okLabel: 'Delete All' });
            if (ok) window.clearAll();
        };

        window.clearAll = async function() {
            products = [];
            sales = [];
            expenses = [];
            udhar = [];
            await window.saveAll();
            window.updateStats();
            window.toast('All cleared');
            render();
        };

        // ============================================================
        // TAB CLICKS
        // ============================================================
        document.querySelectorAll('.tab-btn').forEach(b => {
            b.addEventListener('click', function() {
                window.switchTab(this.dataset.tab);
            });
        });

        // Bill modal close on outside click
        document.getElementById('billModal').addEventListener('click', function(e) {
            if (e.target === this) window.closeBill();
        });

        // ============================================================
        // INIT
        // ============================================================
        async function init() {
            try {
                const [p, s, e, u, sn, lst, th, lba, lg, cse, fbc, sc, lcs] = await Promise.all([
                    storageGet('products', []),
                    storageGet('sales', []),
                    storageGet('expenses', []),
                    storageGet('udhar', []),
                    storageGet('shopName', ''),
                    storageGet('lowStockThreshold', 5),
                    storageGet('theme', 'emerald'),
                    storageGet('lastBackupAt', null),
                    storageGet('appLang', 'en'),
                    storageGet('cloudSyncEnabled', false),
                    storageGet('firebaseConfig', ''),
                    storageGet('syncCode', ''),
                    storageGet('lastCloudSyncAt', null)
                ]);
                products = Array.isArray(p) ? p : [];
                sales = Array.isArray(s) ? s : [];
                expenses = Array.isArray(e) ? e : [];
                udhar = Array.isArray(u) ? u : [];
                shopName = typeof sn === 'string' ? sn : '';
                lowStockThreshold = (typeof lst === 'number' && lst >= 0) ? lst : 5;
                currentTheme = ['emerald', 'ocean', 'sunset', 'midnight'].includes(th) ? th : 'emerald';
                lastBackupAt = typeof lba === 'string' ? lba : null;
                appLang = ['en', 'ur', 'sd'].includes(lg) ? lg : 'en';
                firebaseConfigStr = typeof fbc === 'string' ? fbc : '';
                syncCode = typeof sc === 'string' ? sc : '';
                lastCloudSyncAt = (typeof lcs === 'number') ? lcs : null;
                if (cse === true && firebaseConfigStr && syncCode) {
                    window.connectCloudSync();
                }
            } catch (err) {
                console.log('Load error:', err);
                window.toast('⚠️ Could not load saved data, starting fresh');
            }
            // Everything below only touches things already given safe
            // defaults above, but it's wrapped too so that no matter what,
            // dataLoaded/render() at the end always run and the app never
            // gets stuck on the loading screen.
            try {
                document.documentElement.setAttribute('data-theme', currentTheme);
                const bgColors = { emerald: '#f2f7f5', ocean: '#eef6fb', sunset: '#fdf5ef', midnight: '#0b0e17' };
                const themeMeta = document.getElementById('themeColorMeta');
                if (themeMeta) themeMeta.setAttribute('content', bgColors[currentTheme] || '#f2f7f5');
                window.applyTranslations();
                const nameInput = document.getElementById('shopNameInput');
                nameInput.value = shopName;
                nameInput.disabled = false;
            } catch (err2) {
                console.log('Init finishing error:', err2);
            }
            dataLoaded = true;
            window.updateStats();
            render();
            console.log('✅ Shop Ledger loaded successfully!');
            console.log('Products:', products.length, 'Sales:', sales.length, 'Expenses:', expenses.length, 'Udhar:', udhar.length);
        }

        init();
    </script>
</body>
</html>
